<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' blob: data:"
    >
    <title>Mesurer Electron host contract</title>
  </head>
  <body>
    <main id="app">
      <section data-testid="electron-target">
        <h1>Electron renderer</h1>
        <p>Mesurer should inspect and capture this card through the preload bridge.</p>
        <p data-testid="electron-edit-copy">Electron direct-edit acceptance</p>
        <div data-testid="electron-motion-target" aria-label="Electron CSS animation"></div>
        <button type="button" data-testid="electron-recording-action">Interact while recording</button>
        <div data-testid="electron-color-swatch" aria-label="Electron color swatch"></div>
      </section>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
