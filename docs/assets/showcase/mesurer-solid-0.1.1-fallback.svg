<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="528" viewBox="0 0 1000 528"><rect width="1000" height="528" fill="#f5f5f7"/><text x="40" y="64" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#6e6e73">MESURER-SOLID / V0.1.1</text><text x="40" y="105" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#1d1d1f">Rendered UI evidence for humans and coding agents</text><text x="40" y="142" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" fill="#6e6e73">A Solid 2 port of Mesurer extended with framework-independent mounting, shared context, plugins, and screenshot capture.</text><rect x="40" y="188" width="292" height="172" rx="10" fill="#fff" stroke="#4f8cff"/><text x="58" y="224" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1d1d1f">Rendered inspection</text><text x="58" y="252" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#6e6e73">Exact layout geometry, typography, guides,</text><text x="58" y="272" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#6e6e73">measurements, and visual state from the real page.</text><rect x="352" y="188" width="292" height="172" rx="10" fill="#fff" stroke="#4f8cff"/><text x="370" y="224" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1d1d1f">Shared visual context</text><text x="370" y="252" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#6e6e73">Select the UI once. Humans see the same target that the</text><text x="370" y="272" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#6e6e73">agent reads as structured evidence.</text><rect x="668" y="188" width="292" height="172" rx="16" fill="#111217"/><text x="686" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#f5f5f7">selection context</text><text x="686" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9ec0ff">scope: "selection"</text><text x="686" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9ec0ff">targets: 2</text><text x="686" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9ec0ff">gap: 32px</text><text x="686" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9ec0ff">agent: "ready"</text><text x="40" y="492" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#9b9ba0">Stable on npm: mesurer-solid</text></svg>