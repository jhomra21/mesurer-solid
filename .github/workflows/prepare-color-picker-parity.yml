name: prepare color picker parity contract

on:
  push:
    branches: [pr/text-editing-toolbar-parity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Remove intentionally incompatible upstream toggle case
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("visual-parity/interactions.mjs")
          text = path.read_text()
          old = '  { name: "toolbar-color-picker-close", run: async (p) => { await openColorPicker(p); await realClick(button(p, /^Color picker/)); await sleep(p, 80); } },\n'
          new = '''  // Repeated Color Picker presses intentionally diverge from upstream: Solid starts a\n  // fresh EyeDropper immediately instead of treating the second press as a toggle-off.\n  // Keep first-open/result/copy UI under upstream parity; the repeated-press contract is\n  // covered by interaction-coordination.test.tsx.\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one toolbar-color-picker-close case, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: git diff --check
      - name: Commit parity contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-parity/interactions.mjs
          git commit -m "test: scope color picker parity to shared behavior"
          git push origin HEAD:${GITHUB_REF_NAME}
