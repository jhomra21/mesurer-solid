name: isolated-scroll-contract

on:
  pull_request:
    paths:
      - "packages/mesurer/src/index.tsx"
      - "packages/renderer/src/ComposableMesurer.tsx"
      - "packages/renderer/src/Mesurer.tsx"
      - "packages/renderer/src/components/MeasurementBox.tsx"
      - "packages/renderer/src/components/MesurerOverlay.tsx"
      - "packages/renderer/src/components/Toolbar.tsx"
      - "packages/renderer/src/runtime/document-scroll-anchoring.ts"
      - "packages/renderer/src/runtime/text-editing.ts"
      - "packages/renderer/src/runtime/text-editing-render-in-place.ts"
      - "packages/renderer/src/runtime/text-editing-unified-inspector.ts"
      - "packages/renderer/src/styles.css"
      - "examples/basic/isolated-scroll.html"
      - "examples/basic/src/isolated-scroll.ts"
      - "visual-parity/shadow-anchor-probe.mjs"
      - "visual-parity/isolated-selection-scroll-contract.mjs"
      - ".github/workflows/isolated-scroll-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-scroll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Build foundations
        run: bun run build:foundations

      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start public isolated fixture
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../isolated-scroll-vite.log 2>&1 &
            echo $! > ../../isolated-scroll-vite.pid
          )
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "http://127.0.0.1:4174/isolated-scroll.html" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat isolated-scroll-vite.log || true
            exit 1
          fi

      - name: Prove cross-shadow CSS anchor bridge
        env:
          ISOLATED_SELECTION_SCROLL_URL: http://127.0.0.1:4174/isolated-scroll.html
        run: bun visual-parity/shadow-anchor-probe.mjs

      - name: Exercise public isolated compositor scroll and toolbar avoidance
        env:
          ISOLATED_SELECTION_SCROLL_URL: http://127.0.0.1:4174/isolated-scroll.html
        run: bun visual-parity/isolated-selection-scroll-contract.mjs

      - name: Stop fixture host
        if: always()
        shell: bash
        run: |
          if [ -f isolated-scroll-vite.pid ]; then
            kill "$(cat isolated-scroll-vite.pid)" 2>/dev/null || true
          fi
