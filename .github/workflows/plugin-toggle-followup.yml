name: plugin-toggle-followup

on:
  push:
    branches:
      - feat/compact-plugin-settings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Align follow-up runner with current changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/plugin-toggle-followup.py')
          source = path.read_text()
          old = '- Plugin quick menus now stay single-line, compact plugin Settings are borderless, and Escape closes an open plugin quick menu before Arrange handles its own cancel shortcut.'
          current = '- Keep plugin-heavy Settings compact with collapsed, borderless plugin disclosures, and add Guides-style chevron quick menus with single-line entries for Arrange and Screenshot preferences so common modes can be changed without opening the full Settings panel.'
          if old not in source:
              raise SystemExit('Expected changelog needle not found in follow-up runner')
          path.write_text(source.replace(old, current))
          PY
      - name: Apply plugin lifecycle follow-up
        run: python3 scripts/plugin-toggle-followup.py
      - name: Normalize generated follow-up
        run: |
          python3 - <<'PY'
          from pathlib import Path

          composable = Path('packages/renderer/src/ComposableMesurer.tsx')
          source = composable.read_text()
          old = '''        const parsed = JSON.parse(stored) as StoredAvailablePluginState;
        if (parsed?.version === AVAILABLE_PLUGIN_STORAGE_VERSION) {
          for (const [id, enabled] of Object.entries(parsed.enabled ?? {})) {
            if (typeof enabled === "boolean") storedEnabled.set(id, enabled);
          }
          for (const [id, snapshot] of Object.entries(parsed.state ?? {})) {
            if (snapshot && typeof snapshot === "object" && !Array.isArray(snapshot)) {
              retainedPluginState.set(id, snapshot);
            }
          }
        }'''
          new = '''        // SAFETY: This versioned, namespaced payload is written only by writeAvailablePluginState below; incompatible JSON is ignored by the version gate or caught by this boundary.
        const parsed = JSON.parse(stored) as StoredAvailablePluginState;
        if (parsed?.version === AVAILABLE_PLUGIN_STORAGE_VERSION) {
          for (const [id, enabled] of Object.entries(parsed.enabled ?? {})) storedEnabled.set(id, enabled);
          for (const [id, snapshot] of Object.entries(parsed.state ?? {})) retainedPluginState.set(id, snapshot);
        }'''
          if old not in source:
              raise SystemExit('Expected availability parser block not found')
          composable.write_text(source.replace(old, new, 1))

          contract = Path('visual-parity/plugin-settings-contract.mjs')
          source = contract.read_text()
          marker = '  if (errors.length) throw new Error(`Plugin settings browser errors:'
          start = source.find(marker)
          if start < 0:
              raise SystemExit('Expected browser error block not found')
          end = source.find('  console.log("Plugin settings browser contract: PASS");', start)
          if end < 0:
              raise SystemExit('Expected browser error block end not found')
          replacement = '  if (errors.length) throw new Error(`Plugin settings browser errors:\\n${errors.join("\\n")}`);\n'
          contract.write_text(source[:start] + replacement + source[end:])
          PY
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Diff check
        run: git diff --check
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md packages/renderer/src/ComposableMesurer.tsx packages/renderer/src/components/SettingsPanel.tsx packages/renderer/src/index.ts packages/renderer/src/plugins/settings-runtime.tsx packages/mesurer/src/index.tsx examples/basic/src/plugin-settings.ts visual-parity/plugin-settings-contract.mjs
          git commit -m "feat: let Settings manage plugin availability"
          git push origin HEAD:feat/compact-plugin-settings
