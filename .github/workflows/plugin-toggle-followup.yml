name: plugin-toggle-followup

on:
  push:
    branches:
      - feat/compact-plugin-settings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Align follow-up runner with current changelog
        run: python3 -c "from pathlib import Path; p=Path('scripts/plugin-toggle-followup.py'); s=p.read_text(); old='- Plugin quick menus now stay single-line, compact plugin Settings are borderless, and Escape closes an open plugin quick menu before Arrange handles its own cancel shortcut.'; new='- Keep plugin-heavy Settings compact with collapsed, borderless plugin disclosures, and add Guides-style chevron quick menus with single-line entries for Arrange and Screenshot preferences so common modes can be changed without opening the full Settings panel.'; assert old in s; p.write_text(s.replace(old,new))"
      - name: Apply plugin lifecycle follow-up
        run: python3 scripts/plugin-toggle-followup.py
      - name: Normalize generated follow-up
        run: python3 scripts/plugin-toggle-normalize.py
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Diff check
        run: git diff --check
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md packages/renderer/src/ComposableMesurer.tsx packages/renderer/src/components/SettingsPanel.tsx packages/renderer/src/index.ts packages/renderer/src/plugins/settings-runtime.tsx packages/mesurer/src/index.tsx examples/basic/src/plugin-settings.ts visual-parity/plugin-settings-contract.mjs
          git commit -m "feat: let Settings manage plugin availability"
          git push origin HEAD:feat/compact-plugin-settings
