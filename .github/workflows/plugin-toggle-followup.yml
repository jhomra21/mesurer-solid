name: plugin-toggle-followup

on:
  push:
    branches:
      - feat/compact-plugin-settings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply deterministic plugin reset follow-up
        run: python3 scripts/plugin-toggle-normalize.py
      - name: Add lifecycle diagnostics
        run: python3 scripts/plugin-toggle-diagnose.py
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start plugin settings fixture
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../plugin-toggle-followup-vite.log 2>&1 &
            echo $! > ../../plugin-toggle-followup-vite.pid
          )
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/plugin-settings.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat plugin-toggle-followup-vite.log || true
          exit 1
      - name: Exercise plugin lifecycle contract
        env:
          PLUGIN_SETTINGS_URL: http://127.0.0.1:4174/plugin-settings.html
        run: bun visual-parity/plugin-settings-contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/src/ComposableMesurer.tsx packages/renderer/src/components/SettingsPanel.tsx packages/renderer/src/plugins/settings-runtime.tsx visual-parity/plugin-settings-contract.mjs .github/workflows/browser-contracts.yml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "fix: make plugin defaults reset deterministic"
          git push origin HEAD:feat/compact-plugin-settings
