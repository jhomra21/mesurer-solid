name: prepare-color-picker-capability-refresh

on:
  push:
    branches:
      - pr/text-editing-toolbar-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: prepare color picker capability refresh'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: pr/text-editing-toolbar-parity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Patch live Color Picker capability tracking
        run: |
          python3 - <<'PY'
          from pathlib import Path

          toolbar = Path('packages/renderer/src/components/Toolbar.tsx')
          text = toolbar.read_text()
          old = '''  let suppressClick = false;\n  let previousUserSelect: string | null = null;\n\n  const tooltipsEnabled = () => !guideMenuOpen() && !pluginMenuOpenId() && !props.model.state.settingsOpen;'''
          new = '''  let suppressClick = false;\n  let previousUserSelect: string | null = null;\n  const [colorPickerSupported, setColorPickerSupported] = createSignal(\n    supportsNativeColorPicker(props.ownerWindow),\n  );\n  const colorPickerOwnerWindow = () => toolbarElement?.ownerDocument.defaultView ?? props.ownerWindow;\n  const refreshColorPickerCapability = () => {\n    setColorPickerSupported(supportsNativeColorPicker(colorPickerOwnerWindow()));\n  };\n\n  const tooltipsEnabled = () => !guideMenuOpen() && !pluginMenuOpenId() && !props.model.state.settingsOpen;'''
          if old not in text:
              raise SystemExit('Toolbar state anchor not found')
          text = text.replace(old, new, 1)

          old = '''  onSettled(() => {\n    const handlePointerDown = (event: PointerEvent) => {'''
          new = '''  onSettled(() => {\n    refreshColorPickerCapability();\n    const capabilityInterval = props.ownerWindow.setInterval(refreshColorPickerCapability, 500);\n    const handleCapabilityRefresh = () => refreshColorPickerCapability();\n    const handlePointerDown = (event: PointerEvent) => {'''
          if old not in text:
              raise SystemExit('Toolbar onSettled anchor not found')
          text = text.replace(old, new, 1)

          old = '''    props.ownerWindow.addEventListener("pointerdown", handlePointerDown);\n    keyboardTarget.addEventListener("keydown", handleKeyDown, true);\n    props.ownerWindow.addEventListener("resize", resize);'''
          new = '''    props.ownerWindow.addEventListener("pointerdown", handlePointerDown);\n    props.ownerWindow.addEventListener("focus", handleCapabilityRefresh);\n    props.ownerWindow.addEventListener("pageshow", handleCapabilityRefresh);\n    props.ownerWindow.document.addEventListener("visibilitychange", handleCapabilityRefresh);\n    keyboardTarget.addEventListener("keydown", handleKeyDown, true);\n    props.ownerWindow.addEventListener("resize", resize);'''
          if old not in text:
              raise SystemExit('Toolbar listener anchor not found')
          text = text.replace(old, new, 1)

          old = '''      props.ownerWindow.removeEventListener("pointerdown", handlePointerDown);\n      keyboardTarget.removeEventListener("keydown", handleKeyDown, true);\n      props.ownerWindow.removeEventListener("resize", resize);'''
          new = '''      props.ownerWindow.clearInterval(capabilityInterval);\n      props.ownerWindow.removeEventListener("pointerdown", handlePointerDown);\n      props.ownerWindow.removeEventListener("focus", handleCapabilityRefresh);\n      props.ownerWindow.removeEventListener("pageshow", handleCapabilityRefresh);\n      props.ownerWindow.document.removeEventListener("visibilitychange", handleCapabilityRefresh);\n      keyboardTarget.removeEventListener("keydown", handleKeyDown, true);\n      props.ownerWindow.removeEventListener("resize", resize);'''
          if old not in text:
              raise SystemExit('Toolbar cleanup anchor not found')
          text = text.replace(old, new, 1)

          old = '''      onClick={(event) => event.stopPropagation()}\n      onMouseLeave={tooltip.onTooltipContainerLeave}'''
          new = '''      onClick={(event) => event.stopPropagation()}\n      onMouseEnter={refreshColorPickerCapability}\n      onMouseLeave={tooltip.onTooltipContainerLeave}'''
          if old not in text:
              raise SystemExit('Toolbar mouse anchor not found')
          text = text.replace(old, new, 1)

          old = '''      <Show when={supportsNativeColorPicker(props.ownerWindow)}>'''
          new = '''      <Show when={colorPickerSupported()}>'''
          if old not in text:
              raise SystemExit('Toolbar Color Picker Show anchor not found')
          text = text.replace(old, new, 1)
          toolbar.write_text(text)

          test = Path('packages/renderer/test/interaction-coordination.test.tsx')
          text = test.read_text()
          anchor = '''  it("shows and executes shortcuts for first-party Arrange and Screenshot tools", async () => {'''
          case = '''  it("revalidates Color Picker visibility when native capability disappears after mount", async () => {\n    installStaticEyeDropper();\n    const host = document.createElement("div");\n    document.body.append(host);\n    const dispose = render(\n      () => <ComposableMesurer persistKey="interaction-color-picker-capability-refresh" />,\n      host,\n    );\n    mounted.push(dispose);\n\n    await vi.waitFor(() => {\n      expect(document.querySelector('button[aria-label="Color picker (P)"]')).toBeTruthy();\n    });\n\n    Reflect.deleteProperty(window, "EyeDropper");\n    window.dispatchEvent(new Event("focus"));\n\n    await vi.waitFor(() => {\n      expect(document.querySelector('button[aria-label="Color picker (P)"]')).toBeNull();\n    });\n  });\n\n'''
          if anchor not in text:
              raise SystemExit('Interaction test anchor not found')
          text = text.replace(anchor, case + anchor, 1)
          test.write_text(text)

          contract = Path('visual-parity/color-picker-contract.mjs')
          text = contract.read_text()
          anchor = '''  if (opens !== 3) {\n    throw new Error(`Expected three native EyeDropper opens, got ${opens}`);\n  }\n  if (await supportedPage.locator("[data-mesurer-color-picker-fallback='true']").count()) {'''
          replacement = '''  if (opens !== 3) {\n    throw new Error(`Expected three native EyeDropper opens, got ${opens}`);\n  }\n\n  await supportedPage.evaluate(() => {\n    Reflect.deleteProperty(window, "EyeDropper");\n    window.dispatchEvent(new Event("focus"));\n  });\n  await supportedPage.waitForFunction(() =>\n    document.querySelector('button[aria-label="Color picker (P)"]') === null,\n  );\n\n  if (await supportedPage.locator("[data-mesurer-color-picker-fallback='true']").count()) {'''
          if anchor not in text:
              raise SystemExit('Color Picker browser contract anchor not found')
          text = text.replace(anchor, replacement, 1)
          contract.write_text(text)
          PY
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run --filter 'mesurer-solid-renderer-example' build
      - run: git diff --check
      - name: Commit capability refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/src/components/Toolbar.tsx packages/renderer/test/interaction-coordination.test.tsx visual-parity/color-picker-contract.mjs
          git commit -m "fix: revalidate native Color Picker capability"
          git push origin HEAD:pr/text-editing-toolbar-parity
