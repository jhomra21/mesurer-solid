name: prepare interaction coordination fixes v8

on:
  push:
    branches: [feat/text-editing-toolbar-parity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Apply candidate patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/prepare-interaction-coordination-v7.yml').read_text().splitlines()
          start = workflow.index("          python - <<'PY'") + 1
          end = workflow.index("          PY", start)
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in workflow[start:end])
          exec(compile(script, "interaction-coordination-v7", "exec"))

          path = Path('packages/renderer/src/ComposableMesurer.tsx')
          text = path.read_text()
          old = '    const builtinShortcut = (event: KeyboardEvent): MesurerBuiltinPluginId | null => {'
          new = '    const builtinShortcut = (event: KeyboardEvent): Exclude<MesurerBuiltinPluginId, "distance"> | null => {'
          if text.count(old) != 1:
              raise SystemExit('expected builtinShortcut return type once')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build:foundations
      - run: bun run --filter '@jhomra21/mesurer-solid-renderer' test -- interaction-coordination.test.tsx runtime-intent-extensions.test.ts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run --filter 'mesurer-solid-renderer-example' build
      - run: git diff --check
      - name: Commit interaction fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/src/ComposableMesurer.tsx packages/renderer/src/Mesurer.tsx packages/renderer/src/components/ColorPicker.tsx packages/renderer/src/components/Toolbar.tsx packages/renderer/src/runtime/builtin-actions.ts packages/renderer/test/interaction-coordination.test.tsx
          git commit -m "fix: coordinate Arrange page interactions"
          git push origin HEAD:${GITHUB_REF_NAME}
