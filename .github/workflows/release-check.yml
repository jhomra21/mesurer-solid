name: release-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Validate release-only change
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != release/v* ]]; then
            echo "release-check must run on a release/v* branch; got ${GITHUB_REF_NAME}."
            exit 1
          fi

          version=$(node -p 'require("./packages/mesurer/package.json").version')
          expected_branch="release/v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_branch" ]]; then
            echo "Release branch ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          fi

          git show HEAD^:packages/mesurer/package.json > /tmp/package-before.json
          previous=$(node -p 'require("/tmp/package-before.json").version')
          node scripts/release.mjs assert-newer --from "$previous" --to "$version"
          node scripts/release.mjs notes --version "$version" >/dev/null

          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          if [[ "${#changed[@]}" -ne 2 ]]; then
            echo "Generated release commit must change exactly package version + changelog; got:"
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi

          for path in "${changed[@]}"; do
            case "$path" in
              CHANGELOG.md|packages/mesurer/package.json) ;;
              *)
                echo "Unexpected release PR file: ${path}"
                exit 1
                ;;
            esac
          done

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const before = JSON.parse(fs.readFileSync("/tmp/package-before.json", "utf8"));
          const after = JSON.parse(fs.readFileSync("packages/mesurer/package.json", "utf8"));
          const beforeVersion = before.version;
          const afterVersion = after.version;
          delete before.version;
          delete after.version;
          if (JSON.stringify(before) !== JSON.stringify(after)) {
            throw new Error("Release package.json changed fields other than version");
          }
          if (beforeVersion === afterVersion) {
            throw new Error("Release package.json did not change version");
          }
          NODE

      - name: Validate release tooling and identity
        run: |
          node scripts/check-identity.mjs
          node --test scripts/release.test.mjs
