name: browser-contracts

on:
  pull_request:
    paths:
      - "packages/mesurer-core/src/domain.ts"
      - "packages/mesurer-core/src/model.ts"
      - "packages/renderer/src/ComposableMesurer.tsx"
      - "packages/renderer/src/Mesurer.tsx"
      - "packages/renderer/src/components/Icons.tsx"
      - "packages/renderer/src/components/ContextActions.tsx"
      - "packages/renderer/src/components/DistanceOverlayItem.tsx"
      - "packages/renderer/src/components/MeasurementBox.tsx"
      - "packages/renderer/src/components/MesurerOverlay.tsx"
      - "packages/renderer/src/components/SettingsPanel.tsx"
      - "packages/renderer/src/components/SettingsPanelCore.tsx"
      - "packages/renderer/src/components/Toolbar.tsx"
      - "packages/renderer/src/core/distances.ts"
      - "packages/renderer/src/core/persistence.ts"
      - "packages/renderer/src/core/selection-helpers.ts"
      - "packages/renderer/src/model/create-mesurer-model.ts"
      - "packages/renderer/src/plugins/arrange-core.ts"
      - "packages/renderer/src/plugins/arrange.ts"
      - "packages/renderer/src/plugins/settings-runtime.tsx"
      - "packages/renderer/src/plugins/screenshot.ts"
      - "packages/renderer/src/runtime/builtin-actions.ts"
      - "packages/renderer/src/runtime/color-picker-support.ts"
      - "packages/renderer/src/runtime/document-scroll-anchoring.ts"
      - "packages/renderer/src/runtime/nested-scroll-compensation.ts"
      - "packages/renderer/src/runtime/presentation-preferences.ts"
      - "packages/renderer/src/runtime/text-editing.ts"
      - "packages/renderer/src/runtime/text-editing-core.ts"
      - "packages/renderer/src/runtime/text-editing-presentation.ts"
      - "packages/renderer/src/runtime/text-editing-unified-inspector.ts"
      - "packages/renderer/src/runtime/text-inspector.ts"
      - "packages/renderer/src/runtime/text-presentation-policy-runtime.ts"
      - "packages/renderer/src/styles.css"
      - "packages/renderer/test/arrange-plugin.test.ts"
      - "packages/renderer/test/distances.test.ts"
      - "packages/renderer/test/measurement-box-scroll.test.tsx"
      - "packages/renderer/test/text-editing.test.ts"
      - "packages/mesurer/src/context-plugin.tsx"
      - "examples/basic/index.html"
      - "examples/basic/src/main.tsx"
      - "examples/basic/self-hosting.html"
      - "examples/basic/src/self-hosting.ts"
      - "examples/basic/multi-spacing.html"
      - "examples/basic/src/multi-spacing.ts"
      - "examples/basic/plugin-settings.html"
      - "examples/basic/src/plugin-settings.ts"
      - "visual-parity/arrange-contract.mjs"
      - "visual-parity/arrange-presentation-policy-contract.mjs"
      - "visual-parity/color-picker-contract.mjs"
      - "visual-parity/presentation-settings-contract.mjs"
      - "visual-parity/selection-scroll-contract.mjs"
      - "visual-parity/shortcuts-setting-contract.mjs"
      - "visual-parity/text-editing-contract.mjs"
      - "visual-parity/typography-editing-layout-contract.mjs"
      - "visual-parity/typography-inspector-ownership-contract.mjs"
      - "visual-parity/self-hosting-context.mjs"
      - "visual-parity/multi-spacing.mjs"
      - "visual-parity/plugin-settings-contract.mjs"
      - ".github/workflows/browser-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Build foundations
        run: bun run build:foundations

      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles

      - name: Run rendered-contract unit tests
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' test -- distances.test.ts measurement-box-scroll.test.tsx text-editing.test.ts

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start shared browser fixture host
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../browser-contracts-vite.log 2>&1 &
            echo $! > ../../browser-contracts-vite.pid
          )

          for path in index.html self-hosting.html multi-spacing.html plugin-settings.html; do
            ready=0
            for attempt in $(seq 1 45); do
              if curl --fail --silent --show-error "http://127.0.0.1:4174/${path}" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Browser contract fixture did not become ready: ${path}"
              cat browser-contracts-vite.log || true
              exit 1
            fi
          done

      - name: Exercise Arrange toolbar and drag
        env:
          ARRANGE_URL: http://127.0.0.1:4174/
        run: bun visual-parity/arrange-contract.mjs

      - name: Exercise Arrange presentation preference
        env:
          ARRANGE_PRESENTATION_URL: http://127.0.0.1:4174/
        run: bun visual-parity/arrange-presentation-policy-contract.mjs

      - name: Exercise presentation Settings discoverability
        env:
          PRESENTATION_SETTINGS_URL: http://127.0.0.1:4174/
        run: bun visual-parity/presentation-settings-contract.mjs

      - name: Exercise global Shortcuts setting
        env:
          SHORTCUTS_SETTING_URL: http://127.0.0.1:4174/
        run: bun visual-parity/shortcuts-setting-contract.mjs

      - name: Exercise direct text editing and page style suggestions
        env:
          TEXT_EDITING_URL: http://127.0.0.1:4174/
        run: bun visual-parity/text-editing-contract.mjs

      - name: Exercise Typography layout and contextual activation
        env:
          TYPOGRAPHY_EDITING_URL: http://127.0.0.1:4174/
        run: bun visual-parity/typography-editing-layout-contract.mjs

      - name: Exercise Typography inspector ownership and occlusion
        env:
          TYPOGRAPHY_OWNERSHIP_URL: http://127.0.0.1:4174/
        run: bun visual-parity/typography-inspector-ownership-contract.mjs

      - name: Exercise selection scroll anchoring
        env:
          SELECTION_SCROLL_URL: http://127.0.0.1:4174/
        run: bun visual-parity/selection-scroll-contract.mjs

      - name: Exercise Color Picker capability
        env:
          COLOR_PICKER_URL: http://127.0.0.1:4174/
        run: bun visual-parity/color-picker-contract.mjs

      - name: Measure Mesurer with Mesurer
        env:
          SELF_HOST_URL: http://127.0.0.1:4174/self-hosting.html
          SELF_HOST_OUT: self-hosting-artifacts
          SELF_HOST_DPR: 3
        run: bun visual-parity/self-hosting-context.mjs

      - name: Measure multi-selection spacing
        env:
          MULTI_SPACING_URL: http://127.0.0.1:4174/multi-spacing.html
          MULTI_SPACING_OUT: multi-spacing-artifacts
          MULTI_SPACING_DPR: 3
        run: bun visual-parity/multi-spacing.mjs

      - name: Exercise plugin-contributed Settings controls
        env:
          PLUGIN_SETTINGS_URL: http://127.0.0.1:4174/plugin-settings.html
        run: bun visual-parity/plugin-settings-contract.mjs

      - name: Add rendered contract summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("## Mesurer rendered browser contracts")
          print("")
          print("### Arrange")
          print("- Toolbar enablement after selection exercised in Chromium")
          print("- Nearby-element, X-ray-outline, and guide alignment snapping exercised in Chromium")
          print("- Desired layout is tool-owned by default; General → Keep Arrange changes explicitly opts it into other tools")
          print("- Saved Arrange intent survives Original/Desired presentation switching without another drag")

          print("")
          print("### Presentation settings")
          print("- General visibly exposes Keep text changes and Keep Arrange changes")
          print("- Both switches default off, persist when enabled, and restore cleanly to defaults")

          print("")
          print("### Shortcuts")
          print("- General → Shortcuts persisted master switch exercised in Chromium")
          print("- Disabled global shortcuts leave toolbar actions and Escape lifecycle behavior available")
          print("- Built-in and first-party plugin shortcut gating exercised in Chromium")

          print("")
          print("### Direct text editing / Typography")
          print("- Double-click through an active Arrange overlay exercised in Chromium")
          print("- Full-text selection and target typography inheritance exercised in Chromium")
          print("- Rendered-page font, size, weight, and color suggestions exercised in Chromium")
          print("- Direct typography controls, semantic-only preset popup, and centered chevron exercised in Chromium")
          print("- Saved Text/style intent is Typography-owned by default; Select shows the original page")
          print("- General → Keep text changes explicitly persists saved Text/style presentation across tools")
          print("- Selected measurement chrome and direct-edit ring remain frame-locked to host geometry while scrolling")
          print("- Typography inspector remains viewport-owned; page-linked ring/highlight chrome scrolls beneath and is occluded by it")
          print("- Physical input on Typography UI cannot retarget the active page editor")

          print("")
          print("### Color Picker")
          print("- Native EyeDropper absence is forced and the unavailable toolbar control is required to be absent")
          print("- A mocked native EyeDropper exercises upstream toolbar toggle-off, fresh P-key picking, and visible native results")
          print("- No DOM/CSS Color Picker fallback is permitted")

          print("")
          self_path = Path("self-hosting-artifacts/self-hosting-measurements.json")
          if self_path.exists():
              report = json.loads(self_path.read_text())
              print("### Self-hosting / annotation")
              print(f"- Native capture: **{report['deviceScaleFactor']}x DPR**")
              print(f"- Maximum glyph optical-center offset: **{report['maxOpticalOffset']:.2f} px**")
              print(f"- Annotation trigger: **{report['annotation']['trigger']['width']:.0f}×{report['annotation']['trigger']['height']:.0f}px**")
              print(f"- Annotation composer: **{report['annotation']['composer']['width']:.0f}px** wide")
          else:
              print("### Self-hosting / annotation\n- Measurements were not produced.")

          print("")
          spacing_path = Path("multi-spacing-artifacts/multi-selection-spacing.json")
          if spacing_path.exists():
              report = json.loads(spacing_path.read_text())
              evidence = report["evidence"]
              distances = evidence["distances"]
              print("### Sparse multi-selection / spacing")
              print(f"- Native capture: **{report['deviceScaleFactor']}x DPR**")
              print(f"- Sparse A + C gap: **{report['sparseEvidence']['aToC']['verticalGap']}px**")
              print(f"- Horizontal gaps: **{distances['aToB']['horizontalGap']}px**, **{distances['cToD']['horizontalGap']}px**")
              print(f"- Vertical gaps: **{distances['aToC']['verticalGap']}px**, **{distances['bToD']['verticalGap']}px**")
              print(f"- Spacing overlays: **{evidence['spacingOverlayCount']}**")
          else:
              print("### Sparse multi-selection / spacing\n- Measurements were not produced.")

          print("")
          print("### Plugin settings")
          print("- Available-but-unloaded first-party plugins are discoverable and loadable from Settings")
          print("- Context, Arrange, and Screenshot lifecycle toggles remove and restore real tools/services")
          print("- Plugin-local persistence is exercised independently of the General presentation switches")
          print("- Deterministic defaults reset remains exercised")
          PY

      - name: Upload self-hosting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesurer-self-hosting
          path: self-hosting-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Upload spacing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesurer-multi-selection-spacing
          path: multi-spacing-artifacts
          if-no-files-found: warn
          retention-days: 14
