name: browser-contracts

on:
  pull_request:
    paths:
      - "packages/renderer/src/components/Icons.tsx"
      - "packages/renderer/src/components/ContextActions.tsx"
      - "packages/renderer/src/components/DistanceOverlayItem.tsx"
      - "packages/renderer/src/components/MeasurementBox.tsx"
      - "packages/renderer/src/components/MeasurerOverlay.tsx"
      - "packages/renderer/src/core/distances.ts"
      - "packages/renderer/test/distances.test.ts"
      - "packages/mesurer/src/context-plugin.tsx"
      - "examples/basic/self-hosting.html"
      - "examples/basic/src/self-hosting.ts"
      - "examples/basic/multi-spacing.html"
      - "examples/basic/src/multi-spacing.ts"
      - "visual-parity/self-hosting-context.mjs"
      - "visual-parity/multi-spacing.mjs"
      - ".github/workflows/browser-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles

      - name: Run spacing unit tests
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' test -- distances.test.ts

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start shared browser fixture host
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../browser-contracts-vite.log 2>&1 &
            echo $! > ../../browser-contracts-vite.pid
          )

          for path in self-hosting.html multi-spacing.html; do
            ready=0
            for attempt in $(seq 1 45); do
              if curl --fail --silent --show-error "http://127.0.0.1:4174/${path}" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Browser contract fixture did not become ready: ${path}"
              cat browser-contracts-vite.log || true
              exit 1
            fi
          done

      - name: Measure Mesurer with Mesurer
        env:
          SELF_HOST_URL: http://127.0.0.1:4174/self-hosting.html
          SELF_HOST_OUT: self-hosting-artifacts
          SELF_HOST_DPR: 3
        run: node visual-parity/self-hosting-context.mjs

      - name: Measure multi-selection spacing
        env:
          MULTI_SPACING_URL: http://127.0.0.1:4174/multi-spacing.html
          MULTI_SPACING_OUT: multi-spacing-artifacts
          MULTI_SPACING_DPR: 3
        run: node visual-parity/multi-spacing.mjs

      - name: Add rendered contract summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");

          console.log("## Mesurer rendered browser contracts");
          console.log("");

          const selfPath = "self-hosting-artifacts/self-hosting-measurements.json";
          if (fs.existsSync(selfPath)) {
            const report = JSON.parse(fs.readFileSync(selfPath, "utf8"));
            console.log("### Self-hosting / annotation");
            console.log(`- Native capture: **${report.deviceScaleFactor}x DPR**`);
            console.log(`- Maximum glyph optical-center offset: **${report.maxOpticalOffset.toFixed(2)} px**`);
            console.log(`- Annotation trigger: **${report.annotation.trigger.width.toFixed(0)}×${report.annotation.trigger.height.toFixed(0)}px**`);
            console.log(`- Annotation composer: **${report.annotation.composer.width.toFixed(0)}px** wide`);
          } else {
            console.log("### Self-hosting / annotation\n- Measurements were not produced.");
          }

          console.log("");
          const spacingPath = "multi-spacing-artifacts/multi-selection-spacing.json";
          if (fs.existsSync(spacingPath)) {
            const report = JSON.parse(fs.readFileSync(spacingPath, "utf8"));
            console.log("### Sparse multi-selection / spacing");
            console.log(`- Native capture: **${report.deviceScaleFactor}x DPR**`);
            console.log(`- Sparse A + C gap: **${report.sparseEvidence.aToC.verticalGap}px**`);
            console.log(`- Horizontal gaps: **${report.evidence.distances.aToB.horizontalGap}px**, **${report.evidence.distances.cToD.horizontalGap}px**`);
            console.log(`- Vertical gaps: **${report.evidence.distances.aToC.verticalGap}px**, **${report.evidence.distances.bToD.verticalGap}px**`);
            console.log(`- Spacing overlays: **${report.evidence.spacingOverlayCount}**, dashed`);
          } else {
            console.log("### Sparse multi-selection / spacing\n- Measurements were not produced.");
          }
          NODE

      - name: Upload self-hosting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesurer-self-hosting
          path: self-hosting-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Upload spacing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesurer-multi-selection-spacing
          path: multi-spacing-artifacts
          if-no-files-found: warn
          retention-days: 14
