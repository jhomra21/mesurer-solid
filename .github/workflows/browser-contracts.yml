name: browser-contracts

on:
  pull_request:
    paths:
      - "packages/renderer/src/ComposableMeasurer.tsx"
      - "packages/renderer/src/components/Icons.tsx"
      - "packages/renderer/src/components/ContextActions.tsx"
      - "packages/renderer/src/components/DistanceOverlayItem.tsx"
      - "packages/renderer/src/components/MeasurementBox.tsx"
      - "packages/renderer/src/components/MeasurerOverlay.tsx"
      - "packages/renderer/src/components/SettingsPanel.tsx"
      - "packages/renderer/src/core/distances.ts"
      - "packages/renderer/src/plugins/settings-runtime.tsx"
      - "packages/renderer/src/plugins/screenshot.ts"
      - "packages/renderer/test/distances.test.ts"
      - "packages/mesurer/src/context-plugin.tsx"
      - "examples/basic/self-hosting.html"
      - "examples/basic/src/self-hosting.ts"
      - "examples/basic/multi-spacing.html"
      - "examples/basic/src/multi-spacing.ts"
      - "examples/basic/plugin-settings.html"
      - "examples/basic/src/plugin-settings.ts"
      - "visual-parity/self-hosting-context.mjs"
      - "visual-parity/multi-spacing.mjs"
      - "visual-parity/plugin-settings-contract.mjs"
      - ".github/workflows/browser-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles

      - name: Run spacing unit tests
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' test -- distances.test.ts

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start shared browser fixture host
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../browser-contracts-vite.log 2>&1 &
            echo $! > ../../browser-contracts-vite.pid
          )

          for path in self-hosting.html multi-spacing.html plugin-settings.html; do
            ready=0
            for attempt in $(seq 1 45); do
              if curl --fail --silent --show-error "http://127.0.0.1:4174/${path}" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Browser contract fixture did not become ready: ${path}"
              cat browser-contracts-vite.log || true
              exit 1
            fi
          done

      - name: Measure Mesurer with Mesurer
        env:
          SELF_HOST_URL: http://127.0.0.1:4174/self-hosting.html
          SELF_HOST_OUT: self-hosting-artifacts
          SELF_HOST_DPR: 3
        run: bun visual-parity/self-hosting-context.mjs

      - name: Measure multi-selection spacing
        env:
          MULTI_SPACING_URL: http://127.0.0.1:4174/multi-spacing.html
          MULTI_SPACING_OUT: multi-spacing-artifacts
          MULTI_SPACING_DPR: 3
        run: bun visual-parity/multi-spacing.mjs

      - name: Exercise plugin-contributed Settings controls
        env:
          PLUGIN_SETTINGS_URL: http://127.0.0.1:4174/plugin-settings.html
        run: bun visual-parity/plugin-settings-contract.mjs

      - name: Add rendered contract summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("## Mesurer rendered browser contracts")
          print("")

          self_path = Path("self-hosting-artifacts/self-hosting-measurements.json")
          if self_path.exists():
              report = json.loads(self_path.read_text())
              print("### Self-hosting / annotation")
              print(f"- Native capture: **{report['deviceScaleFactor']}x DPR**")
              print(f"- Maximum glyph optical-center offset: **{report['maxOpticalOffset']:.2f} px**")
              print(f"- Annotation trigger: **{report['annotation']['trigger']['width']:.0f}×{report['annotation']['trigger']['height']:.0f}px**")
              print(f"- Annotation composer: **{report['annotation']['composer']['width']:.0f}px** wide")
          else:
              print("### Self-hosting / annotation\n- Measurements were not produced.")

          print("")
          spacing_path = Path("multi-spacing-artifacts/multi-selection-spacing.json")
          if spacing_path.exists():
              report = json.loads(spacing_path.read_text())
              evidence = report["evidence"]
              distances = evidence["distances"]
              print("### Sparse multi-selection / spacing")
              print(f"- Native capture: **{report['deviceScaleFactor']}x DPR**")
              print(f"- Sparse A + C gap: **{report['sparseEvidence']['aToC']['verticalGap']}px**")
              print(f"- Horizontal gaps: **{distances['aToB']['horizontalGap']}px**, **{distances['cToD']['horizontalGap']}px**")
              print(f"- Vertical gaps: **{distances['aToC']['verticalGap']}px**, **{distances['bToD']['verticalGap']}px**")
              print(f"- Spacing overlays: **{evidence['spacingOverlayCount']}**")
          else:
              print("### Sparse multi-selection / spacing\n- Measurements were not produced.")

          print("")
          print("### Plugin settings")
          print("- Context and Screenshot Settings controls exercised in Chromium")
          print("- Context service survives human UI disable")
          print("- Screenshot tool visibility, outputs, measurement inclusion, and persistence exercised")
          PY

      - name: Upload self-hosting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesurer-self-hosting
          path: self-hosting-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Upload spacing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesurer-multi-selection-spacing
          path: multi-spacing-artifacts
          if-no-files-found: warn
          retention-days: 14
