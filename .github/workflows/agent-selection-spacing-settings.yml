name: staged-selection-spacing-wrapper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Staged patch source wrapper
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/agent-selection-spacing-patch-source.txt').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"

          strict = '''def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {found}: {old[:100]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)
'''
          tolerant = '''def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) >= count:
                  p.write_text(text.replace(old, new, count))
                  return
              source_lines = text.splitlines()
              old_lines = old.strip("\\n").splitlines()
              new_lines = new.strip("\\n").splitlines()
              wanted = [line.strip() for line in old_lines]
              matches = []
              for index in range(max(0, len(source_lines) - len(old_lines) + 1)):
                  if [line.strip() for line in source_lines[index:index + len(old_lines)]] == wanted:
                      matches.append(index)
                      if len(matches) == count:
                          break
              if len(matches) < count:
                  raise SystemExit(f"{path}: expected {count} normalized occurrence(s), found {len(matches)}: {old[:100]!r}")
              for index in reversed(matches):
                  source_lines[index:index + len(old_lines)] = new_lines
              p.write_text("\\n".join(source_lines) + "\\n")
'''
          if strict not in script:
              raise SystemExit('Could not locate strict staged replace helper')
          script = script.replace(strict, tolerant, 1)
          exec(compile(script, '/tmp/selection-spacing-implementation.py', 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/agent-selection-spacing-patch-source.txt').unlink(missing_ok=True)
          Path('.github/workflows/agent-selection-spacing-run2.yml').unlink(missing_ok=True)
          PY
