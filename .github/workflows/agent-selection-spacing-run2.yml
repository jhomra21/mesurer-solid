name: agent-selection-spacing-run2

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'feat/selection-spacing-settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/selection-spacing-settings
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Apply staged implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/agent-selection-spacing-settings.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          strict = '''def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {found}: {old[:100]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)
'''
          tolerant = '''def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) >= count:
                  p.write_text(text.replace(old, new, count))
                  return
              source_lines = text.splitlines()
              old_lines = old.strip("\\n").splitlines()
              new_lines = new.strip("\\n").splitlines()
              wanted = [line.strip() for line in old_lines]
              matches = []
              for index in range(max(0, len(source_lines) - len(old_lines) + 1)):
                  if [line.strip() for line in source_lines[index:index + len(old_lines)]] == wanted:
                      matches.append(index)
                      if len(matches) == count:
                          break
              if len(matches) < count:
                  raise SystemExit(f"{path}: expected {count} normalized occurrence(s), found {len(matches)}: {old[:100]!r}")
              for index in reversed(matches):
                  source_lines[index:index + len(old_lines)] = new_lines
              p.write_text("\\n".join(source_lines) + "\\n")
'''
          if strict not in script:
              raise SystemExit('Could not locate strict staged replace helper')
          Path('/tmp/selection-spacing-implementation.py').write_text(script.replace(strict, tolerant, 1))
          PY
          python3 /tmp/selection-spacing-implementation.py
      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Diff check
        run: git diff --check
      - name: Remove one-shot workflows
        run: rm -f .github/workflows/agent-selection-spacing-settings.yml .github/workflows/agent-selection-spacing-run.yml .github/workflows/agent-selection-spacing-run2.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: configure selection spacing visuals"
          git push origin HEAD:feat/selection-spacing-settings
