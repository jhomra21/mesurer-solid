name: prepare-release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release version strategy
        required: true
        type: choice
        options:
          - beta-next
          - promote-stable
          - patch
          - minor
          - major
          - explicit
      version:
        description: Exact version when release_type is explicit
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Refuse a second open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing=$(gh pr list --state open --base main --json headRefName --jq '.[] | select(.headRefName | startswith("release/v")) | .headRefName' | head -n 1)
          if [[ -n "$existing" ]]; then
            echo "An open release PR already exists: $existing"
            exit 1
          fi

      - name: Prepare version and changelog
        id: release
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          args=(prepare --type "$RELEASE_TYPE")
          if [[ "$RELEASE_TYPE" == "explicit" ]]; then
            if [[ -z "$EXPLICIT_VERSION" ]]; then
              echo "An explicit version is required when release_type=explicit."
              exit 1
            fi
            args+=(--version "$EXPLICIT_VERSION")
          fi
          node scripts/release.mjs "${args[@]}"

      - name: Create release branch
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          branch="release/v${VERSION}"
          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Release branch already exists: ${branch}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/mesurer/package.json CHANGELOG.md
          git commit -m "release: v${VERSION}"
          git push --set-upstream origin "$branch"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          branch="release/v${VERSION}"
          cat > /tmp/release-pr.md <<EOF_BODY
          ## Release v${VERSION}

          This PR was generated by the **prepare-release** workflow.

          Merge only after the normal CI and packed-package consumer smoke checks are green and the version/changelog are correct.

          After merge, publish.yml will validate the merge commit, publish the exact smoke-tested npm tarball through Trusted Publishing/OIDC, verify the registry artifact, create the v${VERSION} tag, and create the GitHub Release.
          EOF_BODY
          if ! gh pr create \
            --base main \
            --head "$branch" \
            --title "release: v${VERSION}" \
            --body-file /tmp/release-pr.md; then
            echo "Failed to create the release PR. If repository Actions settings disallow GitHub Actions from creating pull requests, enable that setting and retry."
            git push origin --delete "$branch" || true
            exit 1
          fi

      - name: Dispatch validation for the generated PR head
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          branch="release/v${VERSION}"
          # GITHUB_TOKEN-created pushes/PRs do not recursively trigger normal workflow events.
          # Explicit workflow_dispatch is the supported exception, so start both required gates here.
          gh workflow run ci.yml --ref "$branch"
          gh workflow run package-smoke.yml --ref "$branch"
