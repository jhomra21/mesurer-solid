name: prepare-release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release version strategy
        required: true
        type: choice
        options:
          - beta-next
          - promote-stable
          - patch
          - minor
          - major
          - explicit
      version:
        description: Exact version when release_type is explicit
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 32 &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/release ')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch as release source
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release preparation must run from main; got ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Resolve release request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TYPE: ${{ inputs.release_type }}
          MANUAL_VERSION: ${{ inputs.version }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          release_type="$MANUAL_TYPE"
          version="$MANUAL_VERSION"

          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            command=""
            extra=""
            read -r command release_type version extra <<< "$COMMENT_BODY"

            if [[ "$command" != "/release" || -n "$extra" ]]; then
              echo "Invalid release command. Expected: /release <type> [version]"
              exit 1
            fi
          fi

          case "$release_type" in
            beta-next|promote-stable|patch|minor|major)
              if [[ -n "$version" ]]; then
                echo "${release_type} does not accept an explicit version."
                exit 1
              fi
              ;;
            explicit)
              if [[ -z "$version" ]]; then
                echo "An explicit version is required when release_type=explicit."
                exit 1
              fi
              ;;
            *)
              echo "Unsupported release type: ${release_type:-<empty>}"
              exit 1
              ;;
          esac

          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Refuse a second open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing=$(gh pr list --state open --base main --json headRefName --jq '.[] | select(.headRefName | startswith("release/v")) | .headRefName' | head -n 1)
          if [[ -n "$existing" ]]; then
            echo "An open release PR already exists: $existing"
            exit 1
          fi

      - name: Prepare version and changelog
        id: release
        env:
          RELEASE_TYPE: ${{ steps.request.outputs.release_type }}
          EXPLICIT_VERSION: ${{ steps.request.outputs.version }}
        shell: bash
        run: |
          args=(prepare --type "$RELEASE_TYPE")
          if [[ "$RELEASE_TYPE" == "explicit" ]]; then
            args+=(--version "$EXPLICIT_VERSION")
          fi
          node scripts/release.mjs "${args[@]}"

      - name: Create release branch
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          branch="release/v${VERSION}"
          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Release branch already exists: ${branch}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/mesurer/package.json CHANGELOG.md
          git commit -m "release: v${VERSION}"
          git push --set-upstream origin "$branch"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          branch="release/v${VERSION}"
          cat > /tmp/release-pr.md <<EOF_BODY
          ## Release v${VERSION}

          This PR was generated by the **prepare-release** workflow.

          Merge only after the lightweight release validation is green and the version/changelog are correct. Runtime, framework-host, and browser compatibility belong to normal source PR validation and are not repeated for a metadata-only release PR.

          After merge, publish.yml builds and packs the exact npm artifact, performs lightweight package/import checks, publishes through Trusted Publishing/OIDC, verifies the registry artifact, creates the v${VERSION} tag, and creates the GitHub Release.
          EOF_BODY
          if ! gh pr create \
            --base main \
            --head "$branch" \
            --title "release: v${VERSION}" \
            --body-file /tmp/release-pr.md; then
            echo "Failed to create the release PR. If repository Actions settings disallow GitHub Actions from creating pull requests, enable that setting and retry."
            git push origin --delete "$branch" || true
            exit 1
          fi

      - name: Dispatch lightweight release validation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          branch="release/v${VERSION}"
          # GITHUB_TOKEN-created pushes/PRs do not recursively trigger normal workflow events.
          # Explicit workflow_dispatch is the supported exception, so start the release gate here.
          gh workflow run release-check.yml --ref "$branch"
