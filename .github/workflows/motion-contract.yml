name: motion-contract

on:
  pull_request:
    paths:
      - "packages/renderer/src/components/MotionPlayer.tsx"
      - "packages/renderer/src/components/InspectInfoCard.tsx"
      - "packages/renderer/src/components/InspectDetailRow.tsx"
      - "packages/renderer/src/components/MesurerOverlay.tsx"
      - "packages/renderer/src/components/MotionPreview.tsx"
      - "packages/renderer/src/components/Toolbar.tsx"
      - "packages/renderer/src/Mesurer.tsx"
      - "packages/renderer/src/core/motion.ts"
      - "packages/renderer/src/core/motion-dependencies.ts"
      - "packages/renderer/src/core/motion-preview.ts"
      - "packages/renderer/src/core/motion-snapshot.ts"
      - "packages/renderer/src/core/observed-motion.ts"
      - "packages/renderer/src/core/inspect-css.ts"
      - "examples/basic/motion-contract.html"
      - "examples/basic/src/motion-contract.ts"
      - "tests/visual-parity/motion-contract.mjs"
      - ".github/workflows/motion-contract.yml"
  workflow_dispatch:

# Keep only the latest run for each PR; non-PR runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build foundations and renderer styles
        run: |
          bun run build:foundations
          bun run --filter '@jhomra21/mesurer-solid-renderer' styles
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The resolved Playwright version is part of the key, so dependency bumps cannot reuse a mismatched browser.
      - name: Cache Playwright Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}-chromium

      - name: Install Linux browser dependencies
        run: bunx playwright install-deps chromium

      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Start Motion fixture
        run: |
          cd examples/basic
          bunx vite --host 127.0.0.1 --port 4179 --strictPort > ../../motion-vite.log 2>&1 &
          echo $! > ../../motion-vite.pid
          cd ../..
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4179/motion-contract.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat motion-vite.log || true
            exit 1
          fi
      - name: Exercise Motion inspection in Chromium
        env:
          MOTION_URL: http://127.0.0.1:4179/motion-contract.html
          MOTION_OUT: motion-artifacts
        run: bun tests/visual-parity/motion-contract.mjs
      - name: Assert Solid runtime diagnostics are clean
        if: always()
        run: |
          if grep -nE 'STRICT_READ_UNTRACKED|\$\$pointermove' motion-vite.log; then
            echo "Motion fixture emitted strict-read or pointer-handler diagnostics."
            exit 1
          fi
          echo "Motion runtime diagnostics: clean"
      - name: Upload Motion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mesurer-motion-contract
          path: motion-artifacts
          if-no-files-found: warn
          retention-days: 14
