name: prepare-color-picker-secure-context

on:
  push:
    branches:
      - pr/text-editing-toolbar-parity

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: validate secure Color Picker capability' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: pr/text-editing-toolbar-parity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Cover secure-context capability semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          interaction = Path('packages/renderer/test/interaction-coordination.test.tsx')
          text = interaction.read_text()
          text = text.replace(
            '  Reflect.deleteProperty(window, "EyeDropper");\n  localStorage.clear();',
            '  Reflect.deleteProperty(window, "EyeDropper");\n  Reflect.deleteProperty(window, "isSecureContext");\n  localStorage.clear();',
            1,
          )
          text = text.replace(
            'const installStaticEyeDropper = (color = "#123456") => {\n  Object.defineProperty(window, "EyeDropper", {',
            'const installStaticEyeDropper = (color = "#123456") => {\n  Object.defineProperty(window, "isSecureContext", { configurable: true, value: true });\n  Object.defineProperty(window, "EyeDropper", {',
            1,
          )
          text = text.replace(
            '  it("opens native color picking on every press while keeping the standard result active", async () => {\n    let opens = 0;\n    Object.defineProperty(window, "EyeDropper", {',
            '  it("opens native color picking on every press while keeping the standard result active", async () => {\n    let opens = 0;\n    Object.defineProperty(window, "isSecureContext", { configurable: true, value: true });\n    Object.defineProperty(window, "EyeDropper", {',
            1,
          )
          text = text.replace(
            '    let reads = 0;\n    Object.defineProperty(window, "EyeDropper", {',
            '    let reads = 0;\n    Object.defineProperty(window, "isSecureContext", { configurable: true, value: true });\n    Object.defineProperty(window, "EyeDropper", {',
            1,
          )
          text = text.replace(
            '  it("does not treat a truthy non-EyeDropper placeholder as native support", async () => {\n    Object.defineProperty(window, "EyeDropper", {',
            '  it("does not treat a truthy non-EyeDropper placeholder as native support", async () => {\n    Object.defineProperty(window, "isSecureContext", { configurable: true, value: true });\n    Object.defineProperty(window, "EyeDropper", {',
            1,
          )
          anchor = '''  it("does not render the Color Picker tool when native EyeDropper is unavailable", async () => {'''
          secure_test = '''  it("does not render Color Picker when the host does not affirm a secure context", async () => {\n    Object.defineProperty(window, "isSecureContext", { configurable: true, value: undefined });\n    Object.defineProperty(window, "EyeDropper", {\n      configurable: true,\n      value: class {\n        async open() {\n          return { sRGBHex: "#123456" };\n        }\n      },\n    });\n\n    const host = document.createElement("div");\n    document.body.append(host);\n    const dispose = render(\n      () => <ComposableMesurer persistKey="interaction-color-picker-insecure-unknown" />,\n      host,\n    );\n    mounted.push(dispose);\n    await new Promise((resolve) => window.setTimeout(resolve, 150));\n    await settle();\n\n    expect(document.querySelector('button[aria-label="Color picker (P)"]')).toBeNull();\n    window.dispatchEvent(new KeyboardEvent("keydown", { key: "p", bubbles: true, cancelable: true }));\n    await settle();\n    expect(document.querySelector(".mesurer-color-picker")).toBeNull();\n  });\n\n'''
          if anchor not in text:
            raise SystemExit('Color Picker unsupported test anchor not found')
          text = text.replace(anchor, secure_test + anchor, 1)
          interaction.write_text(text)

          contract = Path('visual-parity/color-picker-contract.mjs')
          text = contract.read_text()
          anchor = '''  const unsupportedPage = await browser.newPage({\n    viewport: { width: 1280, height: 900 },\n    deviceScaleFactor: 2,\n  });'''
          replacement = '''  const unknownSecureContextPage = await browser.newPage({\n    viewport: { width: 1280, height: 900 },\n    deviceScaleFactor: 2,\n  });\n  watchDiagnostics(unknownSecureContextPage, "unknown-secure-context");\n  await unknownSecureContextPage.addInitScript(() => {\n    Object.defineProperty(window, "isSecureContext", {\n      configurable: true,\n      value: undefined,\n    });\n    Object.defineProperty(window, "EyeDropper", {\n      configurable: true,\n      value: class {\n        async open() {\n          return { sRGBHex: "#5eead4" };\n        }\n      },\n    });\n  });\n  await unknownSecureContextPage.goto(url, { waitUntil: "networkidle" });\n  if (await unknownSecureContextPage.locator('button[aria-label="Color picker (P)"]').count()) {\n    throw new Error("Color Picker rendered when secure-context capability was not affirmed");\n  }\n  await unknownSecureContextPage.keyboard.press("p");\n  await unknownSecureContextPage.waitForTimeout(80);\n  if (await unknownSecureContextPage.locator(".mesurer-color-picker").count()) {\n    throw new Error("Color Picker ran when secure-context capability was not affirmed");\n  }\n  await unknownSecureContextPage.close();\n\n''' + anchor
          if anchor not in text:
            raise SystemExit('Browser unsupported page anchor not found')
          contract.write_text(text.replace(anchor, replacement, 1))
          PY
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run --filter 'mesurer-solid-renderer-example' build
      - run: git diff --check
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run focused Color Picker browser contract
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../color-picker-secure-vite.log 2>&1 &
          )
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "http://127.0.0.1:4174/" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat color-picker-secure-vite.log || true
            exit 1
          fi
          COLOR_PICKER_URL=http://127.0.0.1:4174/ bun visual-parity/color-picker-contract.mjs
      - name: Commit secure-context tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/test/interaction-coordination.test.tsx visual-parity/color-picker-contract.mjs
          git commit -m "test: require secure context for Color Picker"
          git push origin HEAD:pr/text-editing-toolbar-parity
