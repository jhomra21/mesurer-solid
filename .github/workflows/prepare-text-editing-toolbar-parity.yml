name: prepare text editing toolbar parity

on:
  push:
    branches: [feat/text-editing-toolbar-parity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Wire runtime extensions and split-button parity
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          composable = "packages/renderer/src/ComposableMesurer.tsx"
          replace_once(
              composable,
              'import { MesurerPluginSettingsProvider } from "./plugins/settings-runtime";\nimport type { MesurerBuiltinController } from "./runtime/builtin-actions";\nimport {\n',
              'import { MesurerPluginSettingsProvider } from "./plugins/settings-runtime";\nimport { installArrangeSelectGuard } from "./runtime/arrange-select-guard";\nimport type { MesurerBuiltinController } from "./runtime/builtin-actions";\nimport { installTextEditing } from "./runtime/text-editing";\nimport {\n',
          )
          replace_once(
              composable,
              '  pageTarget: HTMLElement | ShadowRoot;\n  createWorkspaceRuntime(): MesurerWorkspaceRuntime;\n',
              '  pageTarget: HTMLElement | ShadowRoot;\n  /** Current canonical page-targeting tool when exposed by the renderer bridge. */\n  currentToolMode?(): MesurerModel["state"]["toolMode"];\n  createWorkspaceRuntime(): MesurerWorkspaceRuntime;\n',
          )
          replace_once(
              composable,
              '''          ctx.service.provide<MesurerSolidRuntimeService>("runtime:solid", {\n            ownerDocument,\n            ownerWindow,\n            portalTarget: target,\n            pageTarget,\n            createWorkspaceRuntime,\n            createInspectorMount,\n          });\n          for (const id of BUILTIN_TOOL_IDS) {\n''',
              '''          const runtimeService: MesurerSolidRuntimeService = {\n            ownerDocument,\n            ownerWindow,\n            portalTarget: target,\n            pageTarget,\n            currentToolMode: () => requireModel().current.toolMode,\n            createWorkspaceRuntime,\n            createInspectorMount,\n          };\n          ctx.service.provide<MesurerSolidRuntimeService>("runtime:solid", runtimeService);\n          installArrangeSelectGuard(ctx, runtimeService);\n          installTextEditing(ctx, runtimeService);\n          for (const id of BUILTIN_TOOL_IDS) {\n''',
          )

          toolbar = "packages/renderer/src/components/Toolbar.tsx"
          replace_once(
              toolbar,
              '''                class={`msr:-ml-1 msr:flex msr:h-8 msr:w-4 msr:items-center msr:justify-center msr:rounded-[6px] msr:outline-none msr:hover:bg-black/10 ${pluginMenuOpenId() === tool.id ? "msr:bg-black/10 msr:text-black" : "msr:text-black"}`}\n                onClick={(event) => togglePluginMenu(tool.id, event.currentTarget.parentElement ?? event.currentTarget)}\n              >\n                <CaretDownIcon size={8} />\n              </button>\n''',
              '''                class={`msr:relative msr:flex msr:h-8 msr:w-4 msr:items-center msr:justify-center msr:rounded-[6px] msr:outline-none msr:hover:bg-black/10 ${pluginMenuOpenId() === tool.id ? "msr:bg-black/10 msr:text-black" : "msr:text-black"}`}\n                onMouseEnter={() => tooltip.onTooltipEnter(`plugin-menu:${tool.id}`)}\n                onMouseLeave={tooltip.onTooltipLeave}\n                onClick={(event) => togglePluginMenu(tool.id, event.currentTarget.parentElement ?? event.currentTarget)}\n              >\n                <CaretDownIcon size={8} />\n                <Tooltip\n                  label={`${tool.label} options`}\n                  visible={tooltipsEnabled() && tooltip.visibleTooltipId() === `plugin-menu:${tool.id}`}\n                  instant={tooltip.tooltipInstant()}\n                  side={tooltipSide()}\n                />\n              </button>\n''',
          )

          text_editing = "packages/renderer/src/runtime/text-editing.ts"
          replace_once(
              text_editing,
              '  let disposed = false;\n  let frame = 0;\n\n  const isPageElement',
              '  let disposed = false;\n  let frame = 0;\n  const currentToolMode = () => runtime.currentToolMode?.() ?? "none";\n\n  const isPageElement',
          )
          text = Path(text_editing).read_text()
          count = text.count('runtime.currentToolMode()')
          if count != 3:
              raise SystemExit(f"{text_editing}: expected 3 currentToolMode calls, found {count}")
          Path(text_editing).write_text(text.replace('runtime.currentToolMode()', 'currentToolMode()'))
          PY
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: git diff --check
      - name: Commit prepared source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/src/ComposableMesurer.tsx packages/renderer/src/components/Toolbar.tsx packages/renderer/src/runtime/text-editing.ts
          git commit -m "feat: coordinate visual intent interactions"
          git push origin HEAD:${GITHUB_REF_NAME}
