name: visual-parity

on:
  pull_request:
    paths:
      - "packages/renderer/**"
      - "packages/mesurer-dom/**"
      - "examples/basic/**"
      - "tests/visual-parity/**"
      - ".github/workflows/visual-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Checkout pinned React parity baseline
        uses: actions/checkout@v4
        with:
          repository: ibelick/mesurer
          ref: 605d202a4cd0404bb7a4808a11b574174bb14d1a
          path: upstream

      - name: Record parity baseline commit
        id: upstream_commit
        shell: bash
        run: |
          sha="$(git -C upstream rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Using ibelick/mesurer parity baseline $sha"

      - name: Assert stylesheet source parity
        run: python3 tests/visual-parity/check-styles.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm for upstream
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install Mesurer Solid workspace
        run: bun install --frozen-lockfile

      - name: Install visual comparison dependencies
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles

      - name: Install React upstream workspace
        run: |
          cd upstream
          npm pkg set packageManager=pnpm@10.15.0
          pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: upstream/apps/site
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare identical fixtures
        run: |
          cp tests/visual-parity/react-fixture.tsx upstream/apps/site/e2e/fixtures/parity.tsx
          cp tests/visual-parity/react.html upstream/apps/site/e2e/fixtures/parity.html
          cp tests/visual-parity/solid-fixture.tsx examples/basic/src/parity.tsx
          cp tests/visual-parity/solid.html examples/basic/parity.html
          cp tests/visual-parity/capture.mjs upstream/apps/site/e2e/parity-capture.mjs
          cp tests/visual-parity/interactions.mjs upstream/apps/site/e2e/parity-interactions.mjs

      - name: Start React and renderer fixtures
        run: |
          (
            cd upstream
            pnpm --filter mesurer-site exec vite --force --host 127.0.0.1 --port 4173 > ../react-vite.log 2>&1 &
            echo $! > ../react-vite.pid
          )
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../solid-vite.log 2>&1 &
            echo $! > ../../solid-vite.pid
          )

          for url in \
            http://127.0.0.1:4173/e2e/fixtures/parity.html \
            http://127.0.0.1:4174/parity.html
          do
            ready=0
            for attempt in $(seq 1 45); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Fixture did not become ready: $url"
              cat react-vite.log || true
              cat solid-vite.log || true
              exit 1
            fi
          done

      - name: Capture matching UI states
        working-directory: upstream/apps/site
        env:
          PARITY_REACT_URL: http://127.0.0.1:4173/e2e/fixtures/parity.html
          PARITY_SOLID_URL: http://127.0.0.1:4174/parity.html
          PARITY_OUT: ${{ github.workspace }}/parity-artifacts
          PARITY_DPR: 1
        run: node e2e/parity-capture.mjs

      - name: Verify current-only parity metadata
        run: bun tests/visual-parity/normalize-current-contract-metadata.mjs parity-artifacts

      - name: Build side-by-side and pixel-diff report
        shell: bash
        run: |
          set -o pipefail
          python3 tests/visual-parity/compare.py parity-artifacts | tee parity-artifacts/report.txt

      - name: Add visual report summary
        env:
          UPSTREAM_SHA: ${{ steps.upstream_commit.outputs.sha }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("parity-artifacts/report.json").read_text())
          print("## React → Solid renderer visual/UI contract parity")
          print("")
          print(f"PR #54 parity baseline: `ibelick/mesurer@{os.environ['UPSTREAM_SHA']}`")
          print("")
          print("| State | pixels > threshold | ratio | computed metric diffs | explicit contract diffs | ignored host-default diffs |")
          print("|---|---:|---:|---:|---:|---:|")
          for name, state in report["states"].items():
              print(f"| {name} | {state['threshold_diff_pixels']} | {state['threshold_diff_ratio']:.4%} | {state['metric_difference_count']} | {state['contract_difference_count']} | {state['ignored_environmental_contract_difference_count']} |")
          PY

      - name: Upload UI contract parity images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-vs-solid-ui-contract
          path: |
            parity-artifacts/comparison-toolbar.png
            parity-artifacts/comparison-settings-*.png
            parity-artifacts/react-settings-*.json
            parity-artifacts/solid-settings-*.json
            parity-artifacts/current-contract-normalization.json
            parity-artifacts/report.json
            parity-artifacts/report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload visual diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-solid-visual-parity-diagnostics
          path: parity-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Capture every button and action at 1x
        working-directory: upstream/apps/site
        env:
          PARITY_REACT_URL: http://127.0.0.1:4173/e2e/fixtures/parity.html
          PARITY_SOLID_URL: http://127.0.0.1:4174/parity.html
          PARITY_OUT: ${{ github.workspace }}/interaction-artifacts
          PARITY_DPR: 1
        run: node e2e/parity-interactions.mjs

      - name: Assert Solid dev runtime diagnostics are clean
        shell: bash
        run: |
          if grep -nE 'STRICT_READ_UNTRACKED|\$\$pointermove' solid-vite.log; then
            echo "Solid dev parity emitted strict-read or pointer-handler diagnostics."
            exit 1
          fi
          echo "Solid dev parity runtime diagnostics: clean"

      - name: Build interaction parity report
        shell: bash
        run: |
          set +e
          python3 tests/visual-parity/compare-interactions.py interaction-artifacts | tee interaction-artifacts/report.txt
          status=${PIPESTATUS[0]}
          echo "$status" > interaction-artifacts/gate-status.txt
          exit 0

      - name: Add interaction report summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("interaction-artifacts/report.json")
          if not path.exists():
              print("## Button/action parity\n\nInteraction capture did not produce a report.")
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print("## Button/action parity")
          print("")
          print("| Interaction | pixels > threshold | state diffs | result |")
          print("|---|---:|---:|---|")
          for name, case in report["cases"].items():
              print(f"| {name} | {case['threshold_diff_pixels']} | {case['state_difference_count']} | {'PASS' if case['passed'] else 'FAIL'} |")
          PY

      - name: Capture every button and action at native 3x
        if: always() && success()
        working-directory: upstream/apps/site
        env:
          PARITY_REACT_URL: http://127.0.0.1:4173/e2e/fixtures/parity.html
          PARITY_SOLID_URL: http://127.0.0.1:4174/parity.html
          PARITY_OUT: ${{ github.workspace }}/interaction-artifacts-3x
          PARITY_DPR: 3
        run: node e2e/parity-interactions.mjs

      - name: Build clean React | Solid 3x images
        if: always()
        run: |
          if compgen -G 'interaction-artifacts-3x/react-*.png' > /dev/null && compgen -G 'interaction-artifacts-3x/solid-*.png' > /dev/null; then
            python3 tests/visual-parity/make-side-by-side.py interaction-artifacts-3x interaction-side-by-side-3x
          else
            echo "No complete native-3x capture set; skipping side-by-side generation."
          fi

      - name: Upload latest side-by-side screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-vs-solid-interactions-3x
          path: interaction-side-by-side-3x
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce button/action parity gate
        if: always()
        run: |
          if [ ! -f interaction-artifacts/gate-status.txt ]; then
            echo "Interaction parity did not run to completion."
            exit 1
          fi
          status=$(cat interaction-artifacts/gate-status.txt)
          if [ "$status" -ne 0 ]; then
            echo "Button/action React → Solid parity failed."
            cat interaction-artifacts/report.txt || true
            exit "$status"
          fi
          echo "Button/action React → Solid parity passed."

      - name: Upload interaction diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-solid-interaction-diagnostics
          path: |
            interaction-artifacts
            solid-vite.log
          if-no-files-found: warn
          retention-days: 14


  current-layout-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@v4

      - name: Checkout current React source
        uses: actions/checkout@v4
        with:
          repository: ibelick/mesurer
          ref: d47fd6056a01da9c442ae04840ec4d0dd46a1257
          path: upstream-current

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm for current React source
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install Mesurer Solid workspace
        run: bun install --frozen-lockfile

      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles

      - name: Install current React workspace
        run: |
          cd upstream-current
          npm pkg set packageManager=pnpm@10.15.0
          pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: upstream-current/apps/site
        run: pnpm exec playwright install --with-deps chromium

      - name: Install image comparison dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Prepare current Layout Guides fixtures
        run: |
          cp tests/visual-parity/current-layout-guides-react.tsx upstream-current/apps/site/e2e/fixtures/current-layout-guides.tsx
          cp tests/visual-parity/current-layout-guides-react.html upstream-current/apps/site/e2e/fixtures/current-layout-guides.html
          cp tests/visual-parity/current-layout-guides-solid.tsx examples/basic/src/current-layout-guides.tsx
          cp tests/visual-parity/current-layout-guides-solid.html examples/basic/current-layout-guides.html
          cp tests/visual-parity/current-layout-guides-capture.mjs upstream-current/apps/site/e2e/current-layout-guides-parity.mjs

      - name: Start current React and Solid fixtures
        run: |
          (
            cd upstream-current
            pnpm --filter mesurer-site exec vite --force --host 127.0.0.1 --port 4183 > ../current-react-vite.log 2>&1 &
            echo $! > ../current-react-vite.pid
          )
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4184 --strictPort > ../../current-solid-vite.log 2>&1 &
            echo $! > ../../current-solid-vite.pid
          )

          for url in             http://127.0.0.1:4183/e2e/fixtures/current-layout-guides.html             http://127.0.0.1:4184/current-layout-guides.html
          do
            ready=0
            for attempt in $(seq 1 45); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Fixture did not become ready: $url"
              cat current-react-vite.log || true
              cat current-solid-vite.log || true
              exit 1
            fi
          done

      - name: Capture current Layout Guides states
        working-directory: upstream-current/apps/site
        env:
          CURRENT_PARITY_REACT_URL: http://127.0.0.1:4183/e2e/fixtures/current-layout-guides.html
          CURRENT_PARITY_SOLID_URL: http://127.0.0.1:4184/current-layout-guides.html
          CURRENT_PARITY_OUT: ${{ github.workspace }}/current-layout-guides-artifacts
        run: node e2e/current-layout-guides-parity.mjs

      - name: Compare current Layout Guides UI
        run: python3 tests/visual-parity/compare-current-layout-guides.py current-layout-guides-artifacts

      - name: Add current-source parity summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("current-layout-guides-artifacts/report.json")
          if not path.exists():
              print("## Current React Layout Guides parity\n\nCapture did not produce a report.")
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print("## Current React Layout Guides parity")
          print("")
          print("Baseline: `ibelick/mesurer@d47fd6056a01da9c442ae04840ec4d0dd46a1257`")
          print("")
          print("| State | perceptible pixels | contract diffs |")
          print("|---|---:|---:|")
          for name, state in report["states"].items():
              print(f"| {name} | {state['threshold_diff_pixels']} | {state['contract_difference_count']} |")
          PY

      - name: Upload current Layout Guides parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-react-layout-guides-parity
          path: |
            current-layout-guides-artifacts
            current-react-vite.log
            current-solid-vite.log
          if-no-files-found: warn
          retention-days: 14
