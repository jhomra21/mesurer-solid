name: agent-selection-spacing-run

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'feat/selection-spacing-settings' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/selection-spacing-settings
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Apply staged implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/agent-selection-spacing-settings.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/selection-spacing-implementation.py').write_text(script)
          PY
          python3 /tmp/selection-spacing-implementation.py
      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Diff check
        run: git diff --check
      - name: Remove one-shot runner
        run: rm -f .github/workflows/agent-selection-spacing-run.yml .github/workflows/agent-selection-spacing-settings.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: configure selection spacing visuals"
          git push origin HEAD:feat/selection-spacing-settings
