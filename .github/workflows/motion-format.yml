name: motion-format

on:
  push:
    branches:
      - feat/upstream-0.2.4-motion-main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/upstream-0.2.4-motion-main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Auto-fix motion port lint
        run: |
          bun run lint:plugin
          bunx oxlint --fix \
            packages/renderer/src/Mesurer.tsx \
            packages/renderer/src/components/MotionPlayer.tsx \
            packages/renderer/src/components/MotionPreview.tsx \
            packages/renderer/src/components/Toolbar.tsx \
            packages/renderer/src/core/motion-dependencies.ts \
            packages/renderer/src/core/motion-preview.ts \
            packages/renderer/src/core/motion-snapshot.ts \
            packages/renderer/src/core/motion.ts \
            packages/renderer/src/core/observed-motion.ts \
            examples/basic/src/motion-contract.ts \
            tests/visual-parity/motion-contract.mjs || true
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer examples/basic/src/motion-contract.ts tests/visual-parity/motion-contract.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format upstream motion port"
          git push origin HEAD:feat/upstream-0.2.4-motion-main
