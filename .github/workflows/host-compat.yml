name: host-compat

on:
  pull_request:
    paths:
      - "packages/mesurer-core/**"
      - "packages/mesurer-dom/**"
      - "packages/renderer/**"
      - "packages/mesurer/**"
      - "examples/solid1/**"
      - "tests/host-compat/**"
      - "scripts/browser-harness/**"
      - "scripts/mesurer-mcp/**"
      - "plugin.json"
      - "mcp.json"
      - ".codex-plugin/**"
      - ".mcp.json"
      - ".agents/plugins/**"
      - "skills/**"
      - ".github/workflows/host-compat.yml"
  push:
    branches: [main]
  workflow_dispatch:

# Keep only the latest run for each PR; non-PR runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  solid1-universal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build Mesurer packages
        run: bun run build
      - name: Build Solid 1 host
        run: bun run --filter 'mesurer-solid1-example' build
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The resolved Playwright version is part of the key, so dependency bumps cannot reuse a mismatched browser.
      - name: Cache Playwright Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}-chromium

      - name: Install Linux browser dependencies
        run: bunx playwright install-deps chromium

      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Start Solid 1 host
        run: |
          cd examples/solid1
          bunx vite --host 127.0.0.1 --port 4180 --strictPort > ../../solid1-vite.log 2>&1 &
          echo $! > ../../solid1-vite.pid
          cd ../..
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4180 >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat solid1-vite.log || true
            exit 1
          fi
      - name: Exercise universal mount and runtime plugins
        env:
          SOLID1_URL: http://127.0.0.1:4180
        run: bun tests/host-compat/solid1-smoke.mjs
      - name: Preserve human Mesurer state across agent injection
        env:
          SOLID1_URL: http://127.0.0.1:4180
        run: bun tests/host-compat/inject-reuse-smoke.mjs
      - name: Exercise local agent plugin through MCP and direct UI
        env:
          SOLID1_URL: http://127.0.0.1:4180
        run: bun tests/host-compat/mesurer-mcp-smoke.mjs
