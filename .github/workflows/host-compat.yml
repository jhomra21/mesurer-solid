name: host-compat

on:
  pull_request:
    paths:
      - "packages/mesurer-core/**"
      - "packages/mesurer-dom/**"
      - "packages/renderer/**"
      - "packages/mesurer/**"
      - "examples/solid1/**"
      - "host-compat/**"
      - ".github/workflows/host-compat.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solid1-universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build Mesurer packages
        run: bun run build
      - name: Build Solid 1 host
        run: bun run --filter 'mesurer-solid1-example' build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start Solid 1 host
        run: |
          cd examples/solid1
          bunx vite --host 127.0.0.1 --port 4180 --strictPort > ../../solid1-vite.log 2>&1 &
          echo $! > ../../solid1-vite.pid
          cd ../..
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4180 >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat solid1-vite.log || true
            exit 1
          fi
      - name: Exercise universal mount and runtime plugins
        env:
          SOLID1_URL: http://127.0.0.1:4180
        run: bun host-compat/solid1-smoke.mjs
