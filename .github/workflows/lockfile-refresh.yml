name: lockfile-refresh

on:
  pull_request:
    paths:
      - ".github/workflows/lockfile-refresh.yml"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-bun-lock
          path: bun.lock
          if-no-files-found: error
          retention-days: 1
