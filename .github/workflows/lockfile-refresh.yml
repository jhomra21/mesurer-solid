name: lockfile-refresh

on:
  pull_request:
    paths:
      - ".github/workflows/lockfile-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerate Bun lockfile
        run: bun install

      - name: Commit refreshed lockfile to PR branch
        shell: bash
        run: |
          if git diff --quiet -- bun.lock && git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            echo "bun.lock is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "refresh Bun lockfile"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
