name: normalize-trusted-types-lock

on:
  push:
    branches:
      - fix/trusted-types-renderer

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/trusted-types-renderer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Rebase lock resolution on main and add branch dependencies
        run: |
          git fetch origin main
          git checkout origin/main -- bun.lock
          bun install
      - name: Commit normalized lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: normalize Trusted Types lockfile"
          git push origin HEAD:fix/trusted-types-renderer
