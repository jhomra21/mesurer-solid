name: toolbar-contract

on:
  pull_request:
    paths:
      - "packages/renderer/src/components/Toolbar.tsx"
      - "packages/renderer/src/styles.css"
      - "packages/renderer/test/toolbar-compact.test.tsx"
      - "examples/basic/plugin-menu-contract.html"
      - "examples/basic/src/plugin-menu-contract.ts"
      - "tests/visual-parity/toolbar-compact-contract.mjs"
      - "tests/visual-parity/toolbar-docking-contract.mjs"
      - "packages/renderer/src/runtime/toolbar-*.ts"
      - "packages/renderer/src/components/SettingsPanel.tsx"
      - "packages/renderer/src/components/ToolbarPrimitives.tsx"
      - "packages/mesurer-core/src/**"
      - "tests/visual-parity/plugin-menu-bounds-contract.mjs"
      - ".github/workflows/toolbar-contract.yml"
  workflow_dispatch:

# Keep only the latest run for each PR; non-PR runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compact-toolbar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Build foundations
        run: bun run build:foundations

      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles

      - name: Run compact toolbar unit contract
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' test -- toolbar-compact.test.tsx

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The resolved Playwright version is part of the key, so dependency bumps cannot reuse a mismatched browser.
      - name: Cache Playwright Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}-chromium

      - name: Install Linux browser dependencies
        run: bunx playwright install-deps chromium

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Start browser fixture
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../toolbar-contract-vite.log 2>&1 &
            echo $! > ../../toolbar-contract-vite.pid
          )

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "http://127.0.0.1:4174/" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Toolbar contract fixture did not become ready"
            cat toolbar-contract-vite.log || true
            exit 1
          fi

      - name: Exercise compact toolbar geometry and motion
        env:
          TOOLBAR_COMPACT_URL: http://127.0.0.1:4174/
        run: bun tests/visual-parity/toolbar-compact-contract.mjs

      - name: Keep tall plugin menus inside the viewport
        env:
          PLUGIN_MENU_BOUNDS_URL: http://127.0.0.1:4174/plugin-menu-contract.html
        run: bun tests/visual-parity/plugin-menu-bounds-contract.mjs

      - name: Exercise toolbar docking and auto-hide
        env:
          TOOLBAR_DOCKING_URL: http://127.0.0.1:4174/
        run: bun tests/visual-parity/toolbar-docking-contract.mjs

      - name: Upload docking evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolbar-docking
          path: toolbar-docking-artifacts
          retention-days: 14
