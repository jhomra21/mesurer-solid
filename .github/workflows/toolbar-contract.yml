name: toolbar-contract

on:
  pull_request:
    paths:
      - "packages/renderer/src/components/Toolbar.tsx"
      - "packages/renderer/src/styles.css"
      - "packages/renderer/test/toolbar-compact.test.tsx"
      - "visual-parity/toolbar-compact-contract.mjs"
      - ".github/workflows/toolbar-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-toolbar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Build foundations
        run: bun run build:foundations

      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles

      - name: Run compact toolbar unit contract
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' test -- toolbar-compact.test.tsx

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start browser fixture
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../toolbar-contract-vite.log 2>&1 &
            echo $! > ../../toolbar-contract-vite.pid
          )

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "http://127.0.0.1:4174/" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Toolbar contract fixture did not become ready"
            cat toolbar-contract-vite.log || true
            exit 1
          fi

      - name: Exercise compact toolbar geometry and motion
        env:
          TOOLBAR_COMPACT_URL: http://127.0.0.1:4174/
        run: bun visual-parity/toolbar-compact-contract.mjs
