name: pr91-persist-alignment

on:
  push:
    branches:
      - feat/compact-plugin-settings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply Persist alignment polish
        run: python3 scripts/pr91-persist-alignment.py
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start plugin settings fixture
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../pr91-persist-vite.log 2>&1 &
          )
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/plugin-settings.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat pr91-persist-vite.log || true
          exit 1
      - name: Exercise plugin settings lifecycle and alignment
        env:
          PLUGIN_SETTINGS_URL: http://127.0.0.1:4174/plugin-settings.html
        run: bun visual-parity/plugin-settings-contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/src/components/SettingsPanel.tsx visual-parity/plugin-settings-contract.mjs
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "fix: align plugin switches with Persist"
          git push origin HEAD:feat/compact-plugin-settings
