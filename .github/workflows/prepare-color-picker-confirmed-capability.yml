name: prepare-color-picker-confirmed-capability

on:
  push:
    branches:
      - pr/text-editing-toolbar-parity

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: prepare confirmed Color Picker capability' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: pr/text-editing-toolbar-parity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Make Color Picker capability opt-in only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          toolbar = Path('packages/renderer/src/components/Toolbar.tsx')
          text = toolbar.read_text()
          old = '''  const [colorPickerSupported, setColorPickerSupported] = createSignal(\n    supportsNativeColorPicker(props.ownerWindow),\n  );'''
          new = '''  const [colorPickerSupported, setColorPickerSupported] = createSignal(false);'''
          if old not in text:
              raise SystemExit('Toolbar capability initialization anchor not found')
          toolbar.write_text(text.replace(old, new, 1))

          test = Path('packages/renderer/test/interaction-coordination.test.tsx')
          text = test.read_text()
          anchor = '''  it("does not render the Color Picker tool when native EyeDropper is unavailable", async () => {'''
          case = '''  it("does not expose Color Picker before native capability is positively confirmed", async () => {\n    const NativeEyeDropper = class {\n      async open() {\n        return { sRGBHex: "#123456" };\n      }\n    };\n    let reads = 0;\n    Object.defineProperty(window, "EyeDropper", {\n      configurable: true,\n      get() {\n        reads += 1;\n        return reads === 1 ? NativeEyeDropper : undefined;\n      },\n    });\n\n    const host = document.createElement("div");\n    document.body.append(host);\n    const dispose = render(\n      () => <ComposableMesurer persistKey="interaction-color-picker-confirmed-only" />,\n      host,\n    );\n    mounted.push(dispose);\n\n    expect(document.querySelector('button[aria-label="Color picker (P)"]')).toBeNull();\n    await settle();\n    expect(document.querySelector('button[aria-label="Color picker (P)"]')).toBeNull();\n  });\n\n'''
          if anchor not in text:
              raise SystemExit('Interaction test anchor not found')
          test.write_text(text.replace(anchor, case + anchor, 1))
          PY
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run --filter 'mesurer-solid-renderer-example' build
      - run: git diff --check
      - name: Commit capability confirmation change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/src/components/Toolbar.tsx packages/renderer/test/interaction-coordination.test.tsx
          git commit -m "fix: require confirmed native Color Picker capability"
          git push origin HEAD:pr/text-editing-toolbar-parity
