name: Recording dependency lock

on:
  push:
    branches:
      - feat/recording-mediabunny
    paths:
      - packages/renderer/package.json
      - .github/workflows/recording-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recording-mediabunny
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Resolve workspace lock
        run: bun install
      - name: Commit generated lock
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: lock MediaBunny dependency"
          git push origin HEAD:feat/recording-mediabunny
