name: manual-acceptance-regressions

on:
  pull_request:
    paths:
      - "packages/renderer/src/components/Toolbar.tsx"
      - "packages/renderer/src/ComposableMesurer.tsx"
      - "packages/renderer/src/runtime/document-scroll-anchoring.ts"
      - "packages/renderer/src/runtime/isolated-document-portal.ts"
      - "packages/renderer/src/runtime/nested-scroll-compensation.ts"
      - "packages/renderer/src/runtime/text-editing.ts"
      - "packages/renderer/src/runtime/text-editing-unified-inspector.ts"
      - "packages/mesurer/src/index.tsx"
      - "examples/basic/package.json"
      - "examples/basic/src/main.tsx"
      - "visual-parity/manual-acceptance-regressions.mjs"
      - ".github/workflows/manual-acceptance-regressions.yml"
  workflow_dispatch:

jobs:
  rejected-manual-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Build foundations
        run: bun run build:foundations

      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start normal renderer playground
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../manual-acceptance-vite.log 2>&1 &
            echo $! > ../../manual-acceptance-vite.pid
          )
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "http://127.0.0.1:4174/" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat manual-acceptance-vite.log || true
            exit 1
          fi

      - name: Reproduce rejected manual UI cases
        env:
          MANUAL_ACCEPTANCE_URL: http://127.0.0.1:4174/
        run: bun visual-parity/manual-acceptance-regressions.mjs

      - name: Stop playground
        if: always()
        shell: bash
        run: |
          if [ -f manual-acceptance-vite.pid ]; then
            kill "$(cat manual-acceptance-vite.pid)" 2>/dev/null || true
          fi
