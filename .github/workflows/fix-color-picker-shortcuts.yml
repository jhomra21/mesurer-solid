name: fix color picker and shortcuts

on:
  push:
    branches:
      - pr/text-editing-toolbar-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: pr/text-editing-toolbar-parity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply color picker fallback and first-party shortcuts
        shell: bash
        run: |
          cat > packages/renderer/src/runtime/builtin-actions.ts <<'EOF'
          import type { ToolMode } from "@jhomra21/mesurer-solid-core";
          import { formatColor, parseCssColor, type ColorSample } from "../core/colors";
          import type { MesurerModel } from "../model/create-mesurer-model";
          import type { MesurerBuiltinPluginId } from "../plugins/builtins";

          type EyeDropperResult = { sRGBHex: string };
          type EyeDropperLike = { open: () => Promise<EyeDropperResult> };
          type WindowWithEyeDropper = Window & { EyeDropper?: new () => EyeDropperLike };

          export type MesurerBuiltinController = {
            run(id: Exclude<MesurerBuiltinPluginId, "distance">): Promise<void>;
            deactivate(id: MesurerBuiltinPluginId): void;
          };

          const dismissColorPicker = (model: MesurerModel) => {
            model.setTransient({
              colorPickerActive: false,
              colorPickerSample: null,
              colorPickerUnsupported: false,
            });
          };

          const activateMode = (model: MesurerModel, mode: ToolMode) => {
            model.setEnabled(true, !model.current.enabled);
            dismissColorPicker(model);
            model.setTransient({ toolbarActive: true });
            model.toggleToolMode(mode);
          };

          const settingsTab = (model: MesurerModel) =>
            model.current.colorPickerActive ? "color-picker" as const
              : model.current.rulersVisible ? "rulers" as const
                : model.current.toolMode === "guides" ? "guides" as const
                  : model.current.toolMode === "select" || model.current.toolMode === "text-inspector" ? "select" as const
                    : "general" as const;

          const visibleColor = (value: string): ColorSample | null => {
            const sample = parseCssColor(value);
            return sample && sample.alpha > 0 ? sample : null;
          };

          const sampleDomColor = (element: Element, ownerWindow: Window): ColorSample | null => {
            const realm = ownerWindow as Window & typeof globalThis;
            const style = ownerWindow.getComputedStyle(element);
            const background = visibleColor(style.backgroundColor);
            if (background) return background;

            if (element instanceof realm.SVGElement) {
              const fill = visibleColor(style.getPropertyValue("fill"));
              if (fill) return fill;
              const stroke = visibleColor(style.getPropertyValue("stroke"));
              if (stroke) return stroke;
            }

            if ((element.textContent?.trim().length ?? 0) > 0) {
              const foreground = visibleColor(style.color);
              if (foreground) return foreground;
            }

            let parent = element.parentElement;
            while (parent) {
              const parentBackground = visibleColor(ownerWindow.getComputedStyle(parent).backgroundColor);
              if (parentBackground) return parentBackground;
              parent = parent.parentElement;
            }

            return visibleColor(style.color);
          };

          const commitColorSample = (
            model: MesurerModel,
            ownerWindow: Window,
            sample: ColorSample,
          ) => {
            model.setTransient({ colorPickerSample: sample, colorPickerUnsupported: false });
            void ownerWindow.navigator.clipboard?.writeText(
              formatColor(sample, model.current.settings.colorPickerClickFormat),
            ).catch(() => undefined);
          };

          const installDomColorPickerFallback = (
            model: MesurerModel,
            ownerWindow: Window,
          ): (() => void) => {
            const ownerDocument = ownerWindow.document;
            const realm = ownerWindow as Window & typeof globalThis;
            const cursorStyle = ownerDocument.createElement("style");
            cursorStyle.dataset.mesurerColorPickerFallback = "true";
            cursorStyle.textContent = [
              "html, body, body * { cursor: crosshair !important; }",
              "[data-mesurer-root='true'], [data-mesurer-root='true'] *, [data-mesurer-inspector-ui='true'], [data-mesurer-inspector-ui='true'] * { cursor: default !important; }",
            ].join("\n");
            (ownerDocument.head ?? ownerDocument.documentElement).append(cursorStyle);

            let cleaned = false;
            const cleanup = () => {
              if (cleaned) return;
              cleaned = true;
              ownerDocument.removeEventListener("pointerdown", onPointerDown, true);
              ownerDocument.removeEventListener("keydown", onKeyDown, true);
              cursorStyle.remove();
            };

            const onPointerDown = (event: PointerEvent) => {
              if (event.button !== 0) return;
              const path = event.composedPath().filter((entry): entry is Element => entry instanceof realm.Element);
              if (path.some((entry) => entry.closest("[data-mesurer-root='true'], [data-mesurer-inspector-ui='true']"))) return;
              const target = path[0];
              if (!target) return;
              const sample = sampleDomColor(target, ownerWindow);
              if (!sample) return;
              event.preventDefault();
              event.stopImmediatePropagation();
              cleanup();
              commitColorSample(model, ownerWindow, sample);
            };

            const onKeyDown = (event: KeyboardEvent) => {
              if (event.key !== "Escape") return;
              event.preventDefault();
              event.stopImmediatePropagation();
              cleanup();
              dismissColorPicker(model);
            };

            ownerDocument.addEventListener("pointerdown", onPointerDown, true);
            ownerDocument.addEventListener("keydown", onKeyDown, true);
            return cleanup;
          };

          export function createMesurerBuiltinController(options: {
            model: MesurerModel;
            ownerWindow: Window;
          }): MesurerBuiltinController {
            const { model, ownerWindow } = options;
            let colorPickerFallbackCleanup: (() => void) | null = null;

            const clearColorPickerFallback = () => {
              colorPickerFallbackCleanup?.();
              colorPickerFallbackCleanup = null;
            };

            const openColorPicker = async () => {
              clearColorPickerFallback();
              model.setEnabled(true, !model.current.enabled);
              model.setToolMode("none", model.current.toolMode !== "none");
              // SAFETY: EyeDropper is an optional browser Window extension and is existence-checked before construction.
              const EyeDropper = (ownerWindow as WindowWithEyeDropper).EyeDropper;
              model.setTransient({ colorPickerActive: true, colorPickerSample: null, colorPickerUnsupported: false });
              if (!EyeDropper) {
                colorPickerFallbackCleanup = installDomColorPickerFallback(model, ownerWindow);
                return;
              }
              try {
                const result = await new EyeDropper().open();
                const sample = parseCssColor(result.sRGBHex);
                if (!sample) {
                  colorPickerFallbackCleanup = installDomColorPickerFallback(model, ownerWindow);
                  return;
                }
                commitColorSample(model, ownerWindow, sample);
              } catch (cause) {
                // SAFETY: ownerWindow is the realm that owns EyeDropper and therefore its DOMException constructor.
                const DOMExceptionCtor = (ownerWindow as Window & typeof globalThis).DOMException;
                if (cause instanceof DOMExceptionCtor && cause.name === "AbortError") {
                  dismissColorPicker(model);
                  return;
                }
                colorPickerFallbackCleanup = installDomColorPickerFallback(model, ownerWindow);
              }
            };

            return {
              async run(id) {
                switch (id) {
                  case "select":
                    clearColorPickerFallback();
                    activateMode(model, "select");
                    return;
                  case "xray":
                    clearColorPickerFallback();
                    model.setEnabled(true);
                    dismissColorPicker(model);
                    model.toggleXray();
                    return;
                  case "color-picker":
                    await openColorPicker();
                    return;
                  case "rulers":
                    clearColorPickerFallback();
                    model.setEnabled(true);
                    dismissColorPicker(model);
                    model.toggleRulers();
                    return;
                  case "text-inspector":
                    clearColorPickerFallback();
                    activateMode(model, "text-inspector");
                    return;
                  case "guides":
                    clearColorPickerFallback();
                    activateMode(model, "guides");
                    return;
                  case "settings": {
                    const open = !model.current.settingsOpen;
                    model.setTransient({
                      settingsOpen: open,
                      settingsTab: open ? settingsTab(model) : model.current.settingsTab,
                    });
                    return;
                  }
                }
              },
              deactivate(id) {
                switch (id) {
                  case "select":
                  case "text-inspector":
                  case "guides":
                    if (model.current.toolMode === id) model.setToolMode("none");
                    return;
                  case "xray":
                    model.setXrayVisible(false);
                    return;
                  case "color-picker":
                    clearColorPickerFallback();
                    dismissColorPicker(model);
                    return;
                  case "rulers":
                    model.setRulersVisible(false);
                    return;
                  case "settings":
                    model.setTransient({ settingsOpen: false });
                    return;
                  case "distance":
                    return;
                }
              },
            };
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path("packages/renderer/src/plugins/arrange.ts"),
                  '      id: "arrange",\n      label: "Arrange",\n      order: 65,',
                  '      id: "arrange",\n      label: "Arrange",\n      shortcut: "M",\n      order: 65,',
                  "arrange shortcut",
              ),
              (
                  Path("packages/renderer/src/plugins/screenshot.ts"),
                  '      id: "screenshot",\n      label: "Screenshot",\n      order: 70,',
                  '      id: "screenshot",\n      label: "Screenshot",\n      shortcut: "Shift+S",\n      order: 70,',
                  "screenshot shortcut",
              ),
              (
                  Path("packages/renderer/src/ComposableMesurer.tsx"),
                  '      if (mod && key === ",") return "settings";\n      if (mod) return null;',
                  '      if (mod && !event.shiftKey && !event.altKey && key === ",") return "settings";\n      if (mod || event.shiftKey || event.altKey) return null;',
                  "exact builtin shortcut modifiers",
              ),
          ]
          for path, old, new, label in replacements:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"{label} pattern not found")
              path.write_text(text.replace(old, new, 1))

          test = Path("packages/renderer/test/interaction-coordination.test.tsx")
          text = test.read_text()
          old_import = 'import { MESURER_ARRANGE_ACTIVE_STATE_ID } from "../src/plugins/arrange";'
          new_import = 'import { MESURER_ARRANGE_ACTIVE_STATE_ID, arrangePlugin } from "../src/plugins/arrange";\nimport { screenshotPlugin } from "../src/plugins/screenshot";'
          if old_import not in text:
              raise SystemExit("interaction test import pattern not found")
          text = text.replace(old_import, new_import, 1)
          marker = '  it("reserves page-interaction tools for Arrange and closes its quick menu after a choice", async () => {'
          if marker not in text:
              raise SystemExit("interaction test insertion marker not found")
          addition = '''  it("falls back to page color sampling when the native EyeDropper API is unavailable", async () => {
            const target = document.createElement("div");
            target.textContent = "fallback target";
            target.style.backgroundColor = "rgb(18, 52, 86)";
            document.body.append(target);
            const host = document.createElement("div");
            document.body.append(host);
            const dispose = render(() => <Mesurer persistKey="interaction-color-picker-fallback" />, host);
            mounted.push(dispose);
            await settle();

            const button = document.querySelector<HTMLButtonElement>('button[aria-label="Color picker (P)"]')!;
            button.click();
            await settle();
            expect(button.getAttribute("aria-pressed")).toBe("true");
            expect(document.querySelector(".mesurer-color-picker")).toBeNull();
            expect(document.querySelector("[data-mesurer-color-picker-fallback='true']")).toBeTruthy();

            target.dispatchEvent(new MouseEvent("pointerdown", { bubbles: true, cancelable: true, button: 0 }));
            await settle();
            expect(document.querySelector("[data-mesurer-color-picker-fallback='true']")).toBeNull();
            expect(document.querySelector(".mesurer-color-picker")?.textContent).toContain("#123456");
            expect(button.getAttribute("aria-pressed")).toBe("true");
          });

          it("shows and executes shortcuts for first-party Arrange and Screenshot tools", async () => {
            const host = document.createElement("div");
            document.body.append(host);
            const dispose = render(
              () => <ComposableMesurer
                persistKey="interaction-first-party-shortcuts"
                plugins={[
                  arrangePlugin(),
                  screenshotPlugin({ captureVisibleTab: async () => new Blob([], { type: "image/png" }) }),
                ]}
              />,
              host,
            );
            mounted.push(dispose);

            const arrangeButton = await vi.waitFor(() => {
              const value = document.querySelector<HTMLButtonElement>('button[aria-label="Arrange (M)"]');
              expect(value).toBeTruthy();
              return value!;
            });
            const screenshotButton = document.querySelector<HTMLButtonElement>('button[aria-label="Screenshot (Shift+S)"]')!;
            expect(screenshotButton).toBeTruthy();

            window.dispatchEvent(new KeyboardEvent("keydown", { key: "S", shiftKey: true, bubbles: true, cancelable: true }));
            await vi.waitFor(() => expect(screenshotButton.getAttribute("aria-pressed")).toBe("true"));
            expect(document.querySelector<HTMLButtonElement>('button[aria-label="Select (S)"]')?.getAttribute("aria-pressed")).toBe("false");

            window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
            await vi.waitFor(() => expect(screenshotButton.getAttribute("aria-pressed")).toBe("false"));

            window.dispatchEvent(new KeyboardEvent("keydown", { key: "m", bubbles: true, cancelable: true }));
            await vi.waitFor(() => expect(arrangeButton.getAttribute("aria-pressed")).toBe("true"));
          });

          '''
          test.write_text(text.replace(marker, addition + marker, 1))
          PY

      - name: Validate changes
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run --filter 'mesurer-solid-renderer-example' build
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/src/runtime/builtin-actions.ts packages/renderer/src/plugins/arrange.ts packages/renderer/src/plugins/screenshot.ts packages/renderer/src/ComposableMesurer.tsx packages/renderer/test/interaction-coordination.test.tsx
          git commit -m "fix: make color picking work without EyeDropper"
          git push origin HEAD:pr/text-editing-toolbar-parity
