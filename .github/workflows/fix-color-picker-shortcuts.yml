name: fix color picker and shortcuts

on:
  push:
    branches:
      - pr/text-editing-toolbar-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: pr/text-editing-toolbar-parity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Add first-party shortcuts and regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path("packages/renderer/src/plugins/arrange.ts"),
                  '      id: "arrange",\n      label: "Arrange",\n      order: 65,',
                  '      id: "arrange",\n      label: "Arrange",\n      shortcut: "M",\n      order: 65,',
                  "arrange shortcut",
              ),
              (
                  Path("packages/renderer/src/plugins/screenshot.ts"),
                  '      id: "screenshot",\n      label: "Screenshot",\n      order: 70,',
                  '      id: "screenshot",\n      label: "Screenshot",\n      shortcut: "Shift+S",\n      order: 70,',
                  "screenshot shortcut",
              ),
              (
                  Path("packages/renderer/src/ComposableMesurer.tsx"),
                  '      if (mod && key === ",") return "settings";\n      if (mod) return null;',
                  '      if (mod && !event.shiftKey && !event.altKey && key === ",") return "settings";\n      if (mod || event.shiftKey || event.altKey) return null;',
                  "exact builtin shortcut modifiers",
              ),
          ]
          for path, old, new, label in replacements:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"{label} pattern not found")
              path.write_text(text.replace(old, new, 1))

          test = Path("packages/renderer/test/interaction-coordination.test.tsx")
          text = test.read_text()
          old_import = 'import { MESURER_ARRANGE_ACTIVE_STATE_ID } from "../src/plugins/arrange";'
          new_import = 'import { MESURER_ARRANGE_ACTIVE_STATE_ID, arrangePlugin } from "../src/plugins/arrange";\nimport { screenshotPlugin } from "../src/plugins/screenshot";'
          if old_import not in text:
              raise SystemExit("interaction test import pattern not found")
          text = text.replace(old_import, new_import, 1)

          marker = '  it("reserves page-interaction tools for Arrange and closes its quick menu after a choice", async () => {'
          if marker not in text:
              raise SystemExit("interaction test insertion marker not found")
          addition = '''  it("falls back to page color sampling when the native EyeDropper API is unavailable", async () => {
            const target = document.createElement("div");
            target.textContent = "fallback target";
            target.style.backgroundColor = "rgb(18, 52, 86)";
            document.body.append(target);
            const host = document.createElement("div");
            document.body.append(host);
            const dispose = render(() => <Mesurer persistKey="interaction-color-picker-fallback" />, host);
            mounted.push(dispose);
            await settle();

            const button = document.querySelector<HTMLButtonElement>('button[aria-label="Color picker (P)"]')!;
            button.click();
            await settle();
            expect(button.getAttribute("aria-pressed")).toBe("true");
            expect(document.querySelector(".mesurer-color-picker")).toBeNull();
            expect(document.querySelector("[data-mesurer-color-picker-fallback='true']")).toBeTruthy();

            target.dispatchEvent(new MouseEvent("pointerdown", { bubbles: true, cancelable: true, button: 0 }));
            await settle();
            expect(document.querySelector("[data-mesurer-color-picker-fallback='true']")).toBeNull();
            expect(document.querySelector(".mesurer-color-picker")?.textContent).toContain("#123456");
            expect(button.getAttribute("aria-pressed")).toBe("true");
          });

          it("shows and executes shortcuts for first-party Arrange and Screenshot tools", async () => {
            const host = document.createElement("div");
            document.body.append(host);
            const dispose = render(
              () => <ComposableMesurer
                persistKey="interaction-first-party-shortcuts"
                plugins={[
                  arrangePlugin(),
                  screenshotPlugin({ captureVisibleTab: async () => new Blob([], { type: "image/png" }) }),
                ]}
              />,
              host,
            );
            mounted.push(dispose);

            const arrangeButton = await vi.waitFor(() => {
              const value = document.querySelector<HTMLButtonElement>('button[aria-label="Arrange (M)"]');
              expect(value).toBeTruthy();
              return value!;
            });
            const screenshotButton = document.querySelector<HTMLButtonElement>('button[aria-label="Screenshot (Shift+S)"]')!;
            expect(screenshotButton).toBeTruthy();

            window.dispatchEvent(new KeyboardEvent("keydown", { key: "S", shiftKey: true, bubbles: true, cancelable: true }));
            await vi.waitFor(() => expect(screenshotButton.getAttribute("aria-pressed")).toBe("true"));
            expect(document.querySelector<HTMLButtonElement>('button[aria-label="Select (S)"]')?.getAttribute("aria-pressed")).toBe("false");

            window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
            await vi.waitFor(() => expect(screenshotButton.getAttribute("aria-pressed")).toBe("false"));

            window.dispatchEvent(new KeyboardEvent("keydown", { key: "m", bubbles: true, cancelable: true }));
            await vi.waitFor(() => expect(arrangeButton.getAttribute("aria-pressed")).toBe("true"));
          });

          '''
          test.write_text(text.replace(marker, addition + marker, 1))
          PY
      - name: Validate changes
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run --filter 'mesurer-solid-renderer-example' build
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/src/plugins/arrange.ts packages/renderer/src/plugins/screenshot.ts packages/renderer/src/ComposableMesurer.tsx packages/renderer/test/interaction-coordination.test.tsx
          git commit -m "feat: add first-party toolbar shortcuts"
          git push origin HEAD:pr/text-editing-toolbar-parity
