name: prepare lint cleanup

on:
  push:
    branches: [feat/text-editing-toolbar-parity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Fix lint findings
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          source = "packages/renderer/src/runtime/text-editing.ts"
          replace_once(
              source,
              '  const realm = ownerWindow as Window & typeof globalThis;\n',
              '  // SAFETY: ownerWindow is the browsing-context global for ownerDocument, so it carries that realm\'s DOM constructors.\n  const realm = ownerWindow as Window & typeof globalThis;\n',
          )
          replace_once(
              source,
              '    const resolved = { element, node: node as Text };\n',
              '    // SAFETY: nodeType was checked against this realm\'s TEXT_NODE constant immediately above.\n    const resolved = { element, node: node as Text };\n',
          )
          replace_once(
              source,
              '      return { element: candidate, node: nodes[0].node as Text, nodeIndex: nodes[0].index };\n',
              '      // SAFETY: nodes contains only direct children whose nodeType is this realm\'s TEXT_NODE.\n      return { element: candidate, node: nodes[0].node as Text, nodeIndex: nodes[0].index };\n',
          )
          replace_once(source, '  classes: [...value.fingerprintClasses],\n', '  classes: value.fingerprintClasses,\n')
          replace_once(source, '      fingerprintClasses: [...session.fingerprint.classes],\n', '      fingerprintClasses: session.fingerprint.classes,\n')
          text = Path(source).read_text()
          count = text.count('for (const [id, value] of [...applied])')
          if count != 2:
              raise SystemExit(f"{source}: expected two copied applied loops, found {count}")
          Path(source).write_text(text.replace(
              'for (const [id, value] of [...applied])',
              'for (const [id, value] of applied)',
          ))

          test = "packages/renderer/test/runtime-intent-extensions.test.ts"
          replace_once(
              test,
              '    const { host, model, pageTarget } = await setup();\n    const target = document.createElement("p");\n    target.id = "source-owned-copy";\n',
              '    const { model, pageTarget } = await setup();\n    const target = document.createElement("p");\n    target.id = "source-owned-copy";\n',
          )
          PY
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build:foundations
      - run: bun run --filter '@jhomra21/mesurer-solid-renderer' test -- runtime-intent-extensions.test.ts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run --filter 'mesurer-solid-renderer-example' build
      - run: git diff --check
      - name: Commit lint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/src/runtime/text-editing.ts packages/renderer/test/runtime-intent-extensions.test.ts
          git commit -m "fix: satisfy text editing lint contracts"
          git push origin HEAD:${GITHUB_REF_NAME}
