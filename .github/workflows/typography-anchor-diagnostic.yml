name: typography-anchor-diagnostic

on:
  pull_request:
    paths:
      - "tests/visual-parity/typography-anchor-diagnostic.mjs"
      - ".github/workflows/typography-anchor-diagnostic.yml"
      - "packages/renderer/src/runtime/document-scroll-anchoring.ts"
      - "packages/renderer/src/runtime/native-scroll-stability.ts"
      - "packages/renderer/src/Mesurer.tsx"
  workflow_dispatch:

# Keep only the latest run for each PR; non-PR runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Build foundations
        run: bun run build:foundations
      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The resolved Playwright version is part of the key, so dependency bumps cannot reuse a mismatched browser.
      - name: Cache Playwright Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}-chromium

      - name: Install Linux browser dependencies
        run: bunx playwright install-deps chromium

      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Start playground
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../typography-anchor-vite.log 2>&1 &
            echo $! > ../../typography-anchor-vite.pid
          )
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "http://127.0.0.1:4174/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat typography-anchor-vite.log || true
          exit 1
      - name: Inspect Typography anchor state
        env:
          TYPOGRAPHY_ANCHOR_URL: http://127.0.0.1:4174/
        run: bun tests/visual-parity/typography-anchor-diagnostic.mjs
      - name: Stop playground
        if: always()
        shell: bash
        run: |
          if [ -f typography-anchor-vite.pid ]; then
            kill "$(cat typography-anchor-vite.pid)" 2>/dev/null || true
          fi
