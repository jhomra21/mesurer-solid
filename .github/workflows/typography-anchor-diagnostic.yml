name: typography-anchor-diagnostic

on:
  pull_request:
    paths:
      - "visual-parity/typography-anchor-diagnostic.mjs"
      - ".github/workflows/typography-anchor-diagnostic.yml"
      - "packages/renderer/src/runtime/document-scroll-anchoring.ts"
      - "packages/renderer/src/runtime/native-scroll-stability.ts"
      - "packages/renderer/src/Mesurer.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Build foundations
        run: bun run build:foundations
      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start playground
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../typography-anchor-vite.log 2>&1 &
            echo $! > ../../typography-anchor-vite.pid
          )
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "http://127.0.0.1:4174/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat typography-anchor-vite.log || true
          exit 1
      - name: Inspect Typography anchor state
        env:
          TYPOGRAPHY_ANCHOR_URL: http://127.0.0.1:4174/
        run: bun visual-parity/typography-anchor-diagnostic.mjs
      - name: Stop playground
        if: always()
        shell: bash
        run: |
          if [ -f typography-anchor-vite.pid ]; then
            kill "$(cat typography-anchor-vite.pid)" 2>/dev/null || true
          fi
