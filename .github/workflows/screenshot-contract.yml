name: screenshot-contract

on:
  pull_request:
    paths:
      - "packages/renderer/src/core/screenshot.ts"
      - "packages/renderer/src/plugins/screenshot.ts"
      - "packages/renderer/src/plugins/screenshot-preview.ts"
      - "packages/renderer/test/screenshot-plugin.test.ts"
      - "packages/mesurer/src/screenshot.ts"
      - "packages/mesurer/src/inject.ts"
      - "packages/mesurer/src/inject-script.ts"
      - "extension/**"
      - "examples/basic/screenshot.html"
      - "examples/basic/screenshot-contract.html"
      - "examples/basic/src/screenshot.ts"
      - "examples/basic/src/screenshot-contract.ts"
      - "tests/visual-parity/screenshot-contract.mjs"
      - ".github/workflows/screenshot-contract.yml"
  workflow_dispatch:

# Keep only the latest run for each PR; non-PR runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build packages and extension
        run: bun run build
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # The resolved Playwright version is part of the key, so dependency bumps cannot reuse a mismatched browser.
      - name: Cache Playwright Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright_version.outputs.version }}-chromium

      - name: Install Linux browser dependencies
        run: bunx playwright install-deps chromium

      - name: Install Chromium
        run: bunx playwright install chromium
      - name: Start screenshot fixture
        run: |
          cd examples/basic
          bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../screenshot-vite.log 2>&1 &
          echo $! > ../../screenshot-vite.pid
          cd ../..
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/screenshot-contract.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat screenshot-vite.log || true
            exit 1
          fi
      - name: Exercise screenshot plugin in Chromium
        env:
          SCREENSHOT_URL: http://127.0.0.1:4174/screenshot-contract.html
        run: bun tests/visual-parity/screenshot-contract.mjs
      - name: Assert Solid runtime diagnostics are clean
        run: |
          if grep -nE 'STRICT_READ_UNTRACKED|\$\$pointermove' screenshot-vite.log; then
            echo "Screenshot fixture emitted strict-read or pointer-handler diagnostics."
            exit 1
          fi
          echo "Screenshot runtime diagnostics: clean"
