name: screenshot-contract

on:
  pull_request:
    paths:
      - "packages/renderer/src/core/screenshot.ts"
      - "packages/renderer/src/plugins/screenshot.ts"
      - "packages/renderer/src/plugins/screenshot-preview.ts"
      - "packages/renderer/test/screenshot-plugin.test.ts"
      - "packages/mesurer/src/screenshot.ts"
      - "packages/mesurer/src/inject.ts"
      - "packages/mesurer/src/inject-script.ts"
      - "extension/**"
      - "examples/basic/screenshot.html"
      - "examples/basic/screenshot-contract.html"
      - "examples/basic/src/screenshot.ts"
      - "examples/basic/src/screenshot-contract.ts"
      - "visual-parity/screenshot-contract.mjs"
      - ".github/workflows/screenshot-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build packages and extension
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start screenshot fixture
        run: |
          cd examples/basic
          bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../screenshot-vite.log 2>&1 &
          echo $! > ../../screenshot-vite.pid
          cd ../..
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/screenshot-contract.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat screenshot-vite.log || true
            exit 1
          fi
      - name: Exercise screenshot plugin in Chromium
        env:
          SCREENSHOT_URL: http://127.0.0.1:4174/screenshot-contract.html
        run: bun visual-parity/screenshot-contract.mjs
      - name: Assert Solid runtime diagnostics are clean
        run: |
          if grep -nE 'STRICT_READ_UNTRACKED|\$\$pointermove' screenshot-vite.log; then
            echo "Screenshot fixture emitted strict-read or pointer-handler diagnostics."
            exit 1
          fi
          echo "Screenshot runtime diagnostics: clean"
