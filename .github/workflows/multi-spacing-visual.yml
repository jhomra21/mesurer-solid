name: multi-spacing-visual

on:
  pull_request:
    paths:
      - "packages/renderer/src/core/distances.ts"
      - "packages/renderer/src/components/DistanceOverlayItem.tsx"
      - "packages/renderer/src/components/MeasurementBox.tsx"
      - "packages/renderer/src/components/MeasurerOverlay.tsx"
      - "packages/renderer/test/distances.test.ts"
      - "examples/basic/multi-spacing.html"
      - "examples/basic/src/multi-spacing.ts"
      - "visual-parity/multi-spacing.mjs"
      - ".github/workflows/multi-spacing-visual.yml"
  workflow_dispatch:

jobs:
  spacing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles

      - name: Run spacing unit tests
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' test -- distances.test.ts

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start spacing fixture
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../multi-spacing-vite.log 2>&1 &
            echo $! > ../../multi-spacing-vite.pid
          )

          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/multi-spacing.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Multi-spacing fixture did not become ready."
            cat multi-spacing-vite.log || true
            exit 1
          fi

      - name: Measure design spacing with Mesurer and capture screenshots
        env:
          MULTI_SPACING_URL: http://127.0.0.1:4174/multi-spacing.html
          MULTI_SPACING_OUT: multi-spacing-artifacts
          MULTI_SPACING_DPR: 3
        run: node visual-parity/multi-spacing.mjs

      - name: Add spacing measurement summary
        if: always()
        shell: bash
        run: |
          if [ ! -f multi-spacing-artifacts/multi-selection-spacing.json ]; then
            echo "## Multi-selection spacing" >> "$GITHUB_STEP_SUMMARY"
            echo "Spacing measurements were not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("multi-spacing-artifacts/multi-selection-spacing.json", "utf8"));
          console.log("## Multi-selection spacing");
          console.log("");
          console.log(`Native capture: **${report.deviceScaleFactor}x DPR**`);
          console.log("");
          console.log(`Sparse selection: **A + C only**, measured vertical gap **${report.sparseEvidence.aToC.verticalGap}px**`);
          console.log(`Mesurer measured horizontal gaps: **${report.evidence.distances.aToB.horizontalGap}px**, **${report.evidence.distances.cToD.horizontalGap}px**`);
          console.log(`Mesurer measured vertical gaps: **${report.evidence.distances.aToC.verticalGap}px**, **${report.evidence.distances.bToD.verticalGap}px**`);
          console.log(`Rendered spacing labels: **${report.evidence.spacingLabels.join(", ")}**`);
          console.log(`Adjacent spacing overlays: **${report.evidence.spacingOverlayCount}**`);
          console.log("Automatic spacing lines: **dashed**");
          NODE

      - name: Upload multi-selection spacing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesurer-multi-selection-spacing
          path: multi-spacing-artifacts
          if-no-files-found: warn
          retention-days: 14
