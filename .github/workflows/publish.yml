name: publish

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  detect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Detect an approved release
        id: release
        env:
          RELEASE_HEAD: ${{ github.event.pull_request.head.ref }}
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          version=$(node -p 'require("./packages/mesurer/package.json").version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual publish recovery is restricted to main; got ${GITHUB_REF}."
              exit 1
            fi

            release_sha=""
            while read -r sha; do
              commit_version=$(git show "${sha}:packages/mesurer/package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
              if [[ "$commit_version" != "$version" ]]; then
                continue
              fi

              parent_sha=$(git rev-parse "${sha}^" 2>/dev/null || true)
              parent_version=""
              if [[ -n "$parent_sha" ]] && git cat-file -e "${parent_sha}:packages/mesurer/package.json" 2>/dev/null; then
                parent_version=$(git show "${parent_sha}:packages/mesurer/package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
              fi

              if [[ "$parent_version" != "$version" ]]; then
                release_sha="$sha"
                break
              fi
            done < <(git log --first-parent --format=%H -- packages/mesurer/package.json)

            if [[ -z "$release_sha" ]]; then
              echo "Could not locate the main-branch commit that introduced ${version}."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$release_sha" HEAD; then
              echo "Resolved release commit ${release_sha} is not an ancestor of current main."
              exit 1
            fi

            release_version=$(git show "${release_sha}:packages/mesurer/package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
            if [[ "$release_version" != "$version" ]]; then
              echo "Resolved release commit ${release_sha} contains ${release_version}, expected ${version}."
              exit 1
            fi

            if ! git diff --quiet "$release_sha" HEAD -- packages package.json bun.lock; then
              echo "Package-affecting files changed after release commit ${release_sha}; refusing to rebuild ${version} from a different package source."
              git diff --name-only "$release_sha" HEAD -- packages package.json bun.lock
              exit 1
            fi

            node scripts/release.mjs notes --version "$version" >/dev/null
            echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected_branch="release/v${version}"
          if [[ "$RELEASE_HEAD" != "$expected_branch" ]]; then
            echo "Merged release branch ${RELEASE_HEAD} does not match package version ${version} (expected ${expected_branch})."
            exit 1
          fi

          previous=$(git show "${RELEASE_BASE_SHA}:packages/mesurer/package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
          if [[ "$version" == "$previous" ]]; then
            echo "Release PR did not change the public package version."
            exit 1
          fi

          node scripts/release.mjs assert-newer --from "$previous" --to "$version"
          node scripts/release.mjs notes --version "$version" >/dev/null
          echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  smoke:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/package-smoke.yml

  publish:
    needs:
      - detect
      - smoke
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use the pinned OIDC-capable npm CLI
        run: |
          npm install --global npm@11.19.0
          npm --version

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: release-artifact

      - name: Read and verify exact release artifact
        id: artifact
        shell: bash
        run: |
          mapfile -t tarballs < <(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected exactly one npm tarball in the release artifact; found ${#tarballs[@]}."
            exit 1
          fi
          tarball=$(realpath "${tarballs[0]}")

          entry_count=$(node -e 'const p=require("./release-artifact/pack.json"); process.stdout.write(String(p.length))')
          if [[ "$entry_count" != "1" ]]; then
            echo "Expected pack.json to describe exactly one package; found ${entry_count}."
            exit 1
          fi

          package=$(node -e 'const p=require("./release-artifact/pack.json")[0]; process.stdout.write(p.name)')
          version=$(node -e 'const p=require("./release-artifact/pack.json")[0]; process.stdout.write(p.version)')
          integrity=$(node -e 'const p=require("./release-artifact/pack.json")[0]; process.stdout.write(p.integrity)')
          expected="${{ needs.detect.outputs.version }}"

          if [[ "$package" != "@jhomra21/mesurer-solid" ]]; then
            echo "Packed package name ${package} is not the public Mesurer Solid package."
            exit 1
          fi
          if [[ "$version" != "$expected" ]]; then
            echo "Packed version ${version} does not match detected release ${expected}."
            exit 1
          fi
          if [[ "$integrity" != sha512-* ]]; then
            echo "Unexpected npm integrity format: ${integrity}"
            exit 1
          fi

          actual_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          if [[ "$actual_integrity" != "$integrity" ]]; then
            echo "Downloaded tarball bytes do not match npm pack integrity metadata."
            exit 1
          fi

          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "integrity=${integrity}" >> "$GITHUB_OUTPUT"

      - name: Publish exact artifact or verify an earlier publish
        env:
          PACKAGE: ${{ steps.artifact.outputs.package }}
          VERSION: ${{ steps.artifact.outputs.version }}
          INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        shell: bash
        run: |
          remote_integrity=$(npm view "${PACKAGE}@${VERSION}" dist.integrity 2>/dev/null || true)
          if [[ -n "$remote_integrity" ]]; then
            if [[ "$remote_integrity" != "$INTEGRITY" ]]; then
              echo "${PACKAGE}@${VERSION} already exists but its integrity does not match this artifact."
              exit 1
            fi
            echo "${PACKAGE}@${VERSION} is already published with matching integrity; continuing recovery."
          else
            if [[ "$VERSION" == *-* ]]; then
              npm publish "$TARBALL" --access public --tag beta
            else
              npm publish "$TARBALL" --access public
            fi
          fi

      - name: Verify npm registry state
        env:
          PACKAGE: ${{ steps.artifact.outputs.package }}
          VERSION: ${{ steps.artifact.outputs.version }}
          INTEGRITY: ${{ steps.artifact.outputs.integrity }}
        shell: bash
        run: |
          verified=0
          for attempt in $(seq 1 12); do
            remote_integrity=$(npm view "${PACKAGE}@${VERSION}" dist.integrity 2>/dev/null || true)
            if [[ "$remote_integrity" == "$INTEGRITY" ]]; then
              verified=1
              break
            fi
            sleep 5
          done
          if [[ "$verified" -ne 1 ]]; then
            echo "Registry integrity never matched the published artifact."
            exit 1
          fi

          expected_tag=latest
          if [[ "$VERSION" == *-* ]]; then expected_tag=beta; fi
          tagged_version=$(npm view "$PACKAGE" dist-tags --json | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const tags=JSON.parse(s); process.stdout.write(tags[process.argv[1]] ?? ""); })' "$expected_tag")
          if [[ "$tagged_version" != "$VERSION" ]]; then
            echo "Expected dist-tag ${expected_tag} -> ${VERSION}, got ${tagged_version:-<missing>}."
            exit 1
          fi

      - name: Create release tag after npm succeeds
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
        shell: bash
        run: |
          tag="v${VERSION}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tagged_commit" != "$RELEASE_SHA" ]]; then
              echo "${tag} already points to ${tagged_commit}, expected release commit ${RELEASE_SHA}."
              exit 1
            fi
            echo "${tag} already points to release commit ${RELEASE_SHA}."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$RELEASE_SHA" -m "$tag"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists."
            exit 0
          fi
          node scripts/release.mjs notes --version "$VERSION" > release-notes.md
          args=(release create "$tag" --verify-tag --title "$tag" --notes-file release-notes.md)
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
