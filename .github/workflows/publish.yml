name: publish

on:
  push:
    branches:
      - main
    paths:
      - "packages/mesurer/package.json"
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Detect a real version release
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          version=$(node -p 'require("./packages/mesurer/package.json").version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual publish recovery is restricted to main; got ${GITHUB_REF}."
              exit 1
            fi
            node scripts/release.mjs notes --version "$version" >/dev/null
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=$(git show "${BEFORE_SHA}:packages/mesurer/package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
          if [[ "$version" == "$previous" ]]; then
            echo "Package manifest changed without a version bump; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/release.mjs assert-newer --from "$previous" --to "$version"
          node scripts/release.mjs notes --version "$version" >/dev/null
          echo "release=true" >> "$GITHUB_OUTPUT"

  smoke:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/package-smoke.yml

  publish:
    needs:
      - detect
      - smoke
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: |
          npm install --global npm@11
          npm --version

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: release-artifact

      - name: Read exact release artifact
        id: artifact
        shell: bash
        run: |
          tarball=$(find release-artifact -maxdepth 1 -name '*.tgz' -print -quit)
          if [[ -z "$tarball" ]]; then
            echo "No npm tarball found in release artifact."
            exit 1
          fi
          package=$(node -e 'const p=require("./release-artifact/pack.json")[0]; process.stdout.write(p.name)')
          version=$(node -e 'const p=require("./release-artifact/pack.json")[0]; process.stdout.write(p.version)')
          integrity=$(node -e 'const p=require("./release-artifact/pack.json")[0]; process.stdout.write(p.integrity)')
          expected="${{ needs.detect.outputs.version }}"
          if [[ "$version" != "$expected" ]]; then
            echo "Packed version ${version} does not match detected release ${expected}."
            exit 1
          fi
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "integrity=${integrity}" >> "$GITHUB_OUTPUT"

      - name: Publish exact artifact or verify an earlier publish
        env:
          PACKAGE: ${{ steps.artifact.outputs.package }}
          VERSION: ${{ steps.artifact.outputs.version }}
          INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        shell: bash
        run: |
          remote_integrity=$(npm view "${PACKAGE}@${VERSION}" dist.integrity 2>/dev/null || true)
          if [[ -n "$remote_integrity" ]]; then
            if [[ "$remote_integrity" != "$INTEGRITY" ]]; then
              echo "${PACKAGE}@${VERSION} already exists but its integrity does not match this artifact."
              exit 1
            fi
            echo "${PACKAGE}@${VERSION} is already published with matching integrity; continuing recovery."
          else
            if [[ "$VERSION" == *-* ]]; then
              npm publish "$TARBALL" --access public --tag beta
            else
              npm publish "$TARBALL" --access public
            fi
          fi

      - name: Verify npm registry state
        env:
          PACKAGE: ${{ steps.artifact.outputs.package }}
          VERSION: ${{ steps.artifact.outputs.version }}
          INTEGRITY: ${{ steps.artifact.outputs.integrity }}
        shell: bash
        run: |
          verified=0
          for attempt in $(seq 1 12); do
            remote_integrity=$(npm view "${PACKAGE}@${VERSION}" dist.integrity 2>/dev/null || true)
            if [[ "$remote_integrity" == "$INTEGRITY" ]]; then
              verified=1
              break
            fi
            sleep 5
          done
          if [[ "$verified" -ne 1 ]]; then
            echo "Registry integrity never matched the published artifact."
            exit 1
          fi

          expected_tag=latest
          if [[ "$VERSION" == *-* ]]; then expected_tag=beta; fi
          tagged_version=$(npm view "$PACKAGE" dist-tags --json | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const tags=JSON.parse(s); process.stdout.write(tags[process.argv[1]] ?? ""); })' "$expected_tag")
          if [[ "$tagged_version" != "$VERSION" ]]; then
            echo "Expected dist-tag ${expected_tag} -> ${VERSION}, got ${tagged_version:-<missing>}."
            exit 1
          fi

      - name: Create release tag after npm succeeds
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "${tag} already points to ${tagged_commit}, expected ${GITHUB_SHA}."
              exit 1
            fi
            echo "${tag} already points to this release commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GITHUB_SHA" -m "$tag"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists."
            exit 0
          fi
          node scripts/release.mjs notes --version "$VERSION" > release-notes.md
          args=(release create "$tag" --verify-tag --title "$tag" --notes-file release-notes.md)
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
