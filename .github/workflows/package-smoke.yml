name: package-smoke

on:
  pull_request:
    paths:
      - "packages/mesurer/**"
      - "packages/mesurer-core/**"
      - "packages/mesurer-dom/**"
      - "packages/renderer/**"
      - "tests/package-smoke/**"
      - "scripts/browser-harness/**"
      - ".github/workflows/package-smoke.yml"
      - "package.json"
      - "bun.lock"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm stays pinned here because this job intentionally verifies the exact
      # npm pack/publish and npm-consumer path. Incidental tooling uses Bun.
      - name: Use the pinned npm CLI
        run: npm install --global npm@11.19.0

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Build publishable workspace
        run: bun run build

      - name: Pack exact sanitized npm artifact
        run: |
          cd packages/mesurer
          bun run stage
          npm pack .publish --json > pack.json
          filename=$(bun -e 'const p=require("./pack.json"); process.stdout.write(p[0].filename)')
          version=$(bun -e 'const p=require("./pack.json"); process.stdout.write(p[0].version)')
          echo "PACKAGE_TGZ=$(realpath "$filename")" >> "$GITHUB_ENV"
          if npm view "mesurer-solid@$version" version >/dev/null 2>&1; then
            echo "mesurer-solid@$version is already published; skipping npm publish --dry-run for this source PR."
          elif [[ "$version" == *-* ]]; then
            npm publish "$(realpath "$filename")" --dry-run --access public --tag beta
          else
            npm publish "$(realpath "$filename")" --dry-run --access public
          fi

      - name: Typecheck canonical and legacy names from a clean consumer
        run: |
          rm -rf /tmp/mesurer-types
          mkdir -p /tmp/mesurer-types
          cd /tmp/mesurer-types
          npm init -y >/dev/null
          npm install "$PACKAGE_TGZ" typescript@5.9.2 >/dev/null
          cat > index.ts <<'TS'
          import {
            defineMesurerPlugin,
            mountMesurer,
            mountMeasurer,
            type MountMesurerOptions,
            type MountMeasurerOptions,
            type MountedMesurer,
            type MountedMeasurer,
            type MesurerPlugin,
            type MesurerTheme,
          } from "mesurer-solid";
          import {
            context,
            createElectronScreenshotCaptureProvider,
            screenshot,
            type MesurerScreenshotPluginOptions,
            type MesurerScreenshotService,
          } from "mesurer-solid/plugins";
          import {
            createMesurerPluginHost,
            type MesurerPluginHost,
          } from "mesurer-solid/core";

          const plugin: MesurerPlugin = defineMesurerPlugin({
            id: "consumer.types",
            setup(ctx) {
              ctx.state.register({ id: "consumer", initial: 0, history: true });
            },
          });
          const theme: MesurerTheme = "dark";
          const options: MountMesurerOptions = { agent: true, theme, plugins: [plugin, context()] };
          const legacyOptions: MountMeasurerOptions = options;
          const screenshotOptions: MesurerScreenshotPluginOptions = { copy: true, download: false };
          const screenshotService: MesurerScreenshotService | undefined = undefined;
          const electronCapture = createElectronScreenshotCaptureProvider(async () => ({
            png: new Uint8Array([137, 80, 78, 71]),
            width: 1,
            height: 1,
          }));
          const canonicalMounted: MountedMesurer | undefined = undefined;
          const legacyMounted: MountedMeasurer | undefined = canonicalMounted;
          const host: MesurerPluginHost = createMesurerPluginHost();
          const resolveScreenshot = async (mounted: MountedMesurer) =>
            mounted.service<MesurerScreenshotService>("screenshot");
          void theme;
          void options;
          void legacyOptions;
          void screenshotOptions;
          void screenshotService;
          void electronCapture;
          void canonicalMounted;
          void legacyMounted;
          void screenshot;
          void host;
          void resolveScreenshot;
          void mountMesurer;
          void mountMeasurer;
          TS
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ESNext",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "strict": true,
              "skipLibCheck": false,
              "noEmit": true,
              "lib": ["ESNext", "DOM", "DOM.Iterable"]
            },
            "include": ["index.ts"]
          }
          JSON
          bunx tsc

      - name: Create clean React consumer with no Mesurer app import
        run: |
          rm -rf /tmp/mesurer-react
          mkdir -p /tmp/mesurer-react
          cd /tmp/mesurer-react
          npm init -y >/dev/null
          npm install "$PACKAGE_TGZ" react@19 react-dom@19 vite@8.1.5 >/dev/null
          echo "REACT_INJECT_SCRIPT_PATH=$(realpath node_modules/mesurer-solid/dist/inject-script.js)" >> "$GITHUB_ENV"
          cat > index.html <<'HTML'
          <!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'"></head><body><div id="root"></div><script type="module" src="/main.js"></script></body></html>
          HTML
          cat > main.js <<'JS'
          import React from "react";
          import { createRoot } from "react-dom/client";

          function App() {
            const [count, setCount] = React.useState(0);
            return React.createElement(
              "div",
              { style: { display: "flex", gap: "12px", margin: "80px", padding: "20px" } },
              React.createElement(
                "button",
                {
                  "data-testid": "consumer-counter",
                  style: { padding: "16px 24px" },
                  onClick: () => setCount((value) => value + 1),
                },
                `React host · count ${count}`,
              ),
              React.createElement(
                "div",
                { "data-testid": "consumer-sibling", style: { width: "140px", padding: "16px" } },
                "Measured sibling",
              ),
            );
          }

          createRoot(document.getElementById("root")).render(React.createElement(App));
          window.__HOST_READY__ = true;
          JS

      - name: Create clean Solid 1 consumer using mountMesurer
        run: |
          rm -rf /tmp/mesurer-solid1
          mkdir -p /tmp/mesurer-solid1
          cd /tmp/mesurer-solid1
          npm init -y >/dev/null
          npm install "$PACKAGE_TGZ" solid-js@1.9.12 vite@8.1.5 >/dev/null
          cat > index.html <<'HTML'
          <!doctype html><html><body><div id="root"></div><script type="module" src="/main.js"></script></body></html>
          HTML
          cat > main.js <<'JS'
          import { createEffect, createSignal } from "solid-js";
          import { render } from "solid-js/web";
          import { defineMesurerPlugin, mountMesurer } from "mesurer-solid";

          const root = document.getElementById("root");
          render(() => {
            const wrapper = document.createElement("div");
            wrapper.style.display = "flex";
            wrapper.style.gap = "12px";
            wrapper.style.margin = "80px";
            wrapper.style.padding = "20px";
            const button = document.createElement("button");
            button.dataset.testid = "consumer-counter";
            button.style.padding = "16px 24px";
            const [count, setCount] = createSignal(0);
            createEffect(() => { button.textContent = `Solid 1 host · count ${count()}`; });
            button.addEventListener("click", () => setCount((value) => value + 1));
            const sibling = document.createElement("div");
            sibling.dataset.testid = "consumer-sibling";
            sibling.style.width = "140px";
            sibling.style.padding = "16px";
            sibling.textContent = "Measured sibling";
            wrapper.append(button, sibling);
            return wrapper;
          }, root);

          const plugin = defineMesurerPlugin({
            id: "package-smoke",
            setup(ctx) {
              ctx.state.register({ id: "package-smoke", initial: 0, history: true });
              ctx.service.provide("package-smoke", { ready: true });
              ctx.command.register("package-smoke.increment", () => {
                let count = 0;
                ctx.state.update("package-smoke", (value) => {
                  count = value + 1;
                  return count;
                });
                return { count };
              });
            },
          });
          const mesurer = mountMesurer({ agent: true, theme: "light", plugins: [plugin] });
          await mesurer.ready;
          const service = await mesurer.service("package-smoke");
          if (!service?.ready) throw new Error("Mounted service resolution failed");
          window.__HOST_READY__ = true;
          JS

      - name: Create clean compiled Solid 2 consumer using the same public mount API
        run: |
          rm -rf /tmp/mesurer-solid2
          mkdir -p /tmp/mesurer-solid2/src
          cd /tmp/mesurer-solid2
          npm init -y >/dev/null
          npm install "$PACKAGE_TGZ" solid-js@2.0.0-rc.0 @solidjs/web@2.0.0-rc.0 vite@8.1.5 @solidjs/vite-plugin@3.0.0-next.29 >/dev/null
          cat > index.html <<'HTML'
          <!doctype html><html><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
          HTML
          cat > vite.config.mjs <<'JS'
          import solid from "@solidjs/vite-plugin";
          import { defineConfig } from "vite";

          export default defineConfig({ plugins: [solid()] });
          JS
          cat > src/main.tsx <<'TSX'
          import { createSignal } from "solid-js";
          import { render } from "@solidjs/web";
          import { defineMesurerPlugin, mountMesurer } from "mesurer-solid";
          import { context } from "mesurer-solid/plugins";

          function App() {
            const [count, setCount] = createSignal(0);
            return (
              <div style={{ display: "flex", gap: "12px", margin: "80px", padding: "20px" }}>
                <button
                  data-testid="consumer-counter"
                  style={{ padding: "16px 24px" }}
                  onClick={() => setCount((value) => value + 1)}
                >
                  Solid 2 host · count {count()}
                </button>
                <div data-testid="consumer-sibling" style={{ width: "140px", padding: "16px" }}>
                  Measured sibling
                </div>
              </div>
            );
          }

          const root = document.getElementById("root");
          if (!root) throw new Error("Missing Solid 2 root");
          render(() => <App />, root);

          const plugin = defineMesurerPlugin({
            id: "package-smoke",
            setup(ctx) {
              ctx.state.register({ id: "package-smoke", initial: 0, history: true });
              ctx.service.provide("package-smoke", { ready: true });
              ctx.command.register("package-smoke.increment", () => {
                let count = 0;
                ctx.state.update<number>("package-smoke", (value) => {
                  count = value + 1;
                  return count;
                });
                return { count };
              });
            },
          });
          const mesurer = mountMesurer({ agent: true, theme: "dark", plugins: [plugin, context()] });
          await mesurer.ready;
          const service = await mesurer.service<{ ready: boolean }>("package-smoke");
          if (!service.ready) throw new Error("Mounted service resolution failed");
          (window as Window & { __HOST_READY__?: boolean }).__HOST_READY__ = true;
          TSX

      - name: Install headless Chromium shell
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Create clean Electron renderer consumer
        run: |
          rm -rf /tmp/mesurer-electron
          mkdir -p /tmp/mesurer-electron
          cp tests/package-smoke/electron-renderer/* /tmp/mesurer-electron/
          cd /tmp/mesurer-electron
          bun init -y >/dev/null
          bun add "$PACKAGE_TGZ"
          bun add electron@43.1.1 --trust
          bun node_modules/electron/install.js
          test -f node_modules/electron/dist/chrome-sandbox
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          bun build renderer.ts --target browser --format esm --outfile=renderer.js

      - name: Exercise exact packed package in a real Electron renderer
        env:
          MESURER_ELECTRON_ARTIFACT_DIR: /tmp/mesurer-electron/artifacts
        run: |
          rm -rf electron-renderer-artifacts
          set +e
          (
            cd /tmp/mesurer-electron
            timeout 60s xvfb-run -a ./node_modules/.bin/electron main.cjs
          )
          status=$?
          set -e
          if [ -d /tmp/mesurer-electron/artifacts ]; then
            cp -R /tmp/mesurer-electron/artifacts electron-renderer-artifacts
            cat electron-renderer-artifacts/result.json || true
          fi
          exit "$status"

      - name: Upload Electron renderer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-renderer-e2e
          path: electron-renderer-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Start packed-package consumers
        run: |
          (cd /tmp/mesurer-react && bunx vite --host 127.0.0.1 --port 4190 --strictPort > /tmp/react-consumer.log 2>&1 &)
          (cd /tmp/mesurer-solid1 && bunx vite --host 127.0.0.1 --port 4191 --strictPort > /tmp/solid1-consumer.log 2>&1 &)
          (cd /tmp/mesurer-solid2 && bunx vite --host 127.0.0.1 --port 4192 --strictPort > /tmp/solid2-consumer.log 2>&1 &)
          for url in http://127.0.0.1:4190 http://127.0.0.1:4191 http://127.0.0.1:4192; do
            ready=0
            for attempt in $(seq 1 45); do
              if curl --fail --silent "$url" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat /tmp/react-consumer.log || true
              cat /tmp/solid1-consumer.log || true
              cat /tmp/solid2-consumer.log || true
              exit 1
            fi
          done

      - name: Exercise exact packed package in real framework hosts and browser-eval injection
        env:
          REACT_URL: http://127.0.0.1:4190
          SOLID1_PACKAGE_URL: http://127.0.0.1:4191
          SOLID2_PACKAGE_URL: http://127.0.0.1:4192
          REACT_INJECT_SCRIPT_PATH: ${{ env.REACT_INJECT_SCRIPT_PATH }}
        run: |
          bun tests/package-smoke/consumer-smoke.mjs
          bun tests/package-smoke/typography-hover-occlusion.mjs
          bun tests/package-smoke/annotation-draft-handoff.mjs
          bun tests/package-smoke/annotation-adjacent-handoff.mjs

      - name: Upload publish candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: |
            packages/mesurer/*.tgz
            packages/mesurer/pack.json
          if-no-files-found: error
          retention-days: 14
