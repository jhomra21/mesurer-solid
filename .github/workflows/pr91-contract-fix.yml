name: pr91-contract-fix

on:
  push:
    branches:
      - feat/compact-plugin-settings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mesurer Solid
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply contract fixes
        run: python3 scripts/pr91-contract-fix.py
      - name: Install workspace
        run: bun install --frozen-lockfile
      - name: Generate renderer styles
        run: bun run --filter '@jhomra21/mesurer-solid-renderer' styles
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start browser fixture
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../pr91-contract-vite.log 2>&1 &
          )
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat pr91-contract-vite.log || true
          exit 1
      - name: Exercise Arrange contract
        env:
          ARRANGE_URL: http://127.0.0.1:4174/
        run: bun visual-parity/arrange-contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit validated contract fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-parity/arrange-contract.mjs visual-parity/capture.mjs
          if git diff --cached --quiet; then
            echo "No contract changes to commit."
            exit 0
          fi
          git commit -m "test: align plugin extension parity contracts"
          git push origin HEAD:feat/compact-plugin-settings
