name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: tools/mesurer-mcp
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun test
        working-directory: tools/mesurer-mcp
      - run: bun build src/server.ts --target=bun --outfile=/tmp/mesurer-mcp.js
        working-directory: tools/mesurer-mcp
      - run: bun run build
      - run: bun run --filter 'mesurer-solid-renderer-example' build
