name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Lint feature-changed code
        run: >-
          bun run lint --
          extension/background.js
          extension/build.mjs
          packages/mesurer-dom/src/index.ts
          packages/mesurer/scripts/install-skill.mjs
          packages/mesurer/scripts/stage-package.mjs
          packages/mesurer/src/agent.ts
          packages/mesurer/src/context.ts
          packages/mesurer/src/index.tsx
          packages/mesurer/src/inject.ts
          packages/renderer/src/components/ContextActions.tsx
          packages/renderer/src/index.ts
          packages/renderer/src/model/create-measurer-model.ts
          packages/renderer/src/runtime/workspace-context.ts
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run --filter 'mesurer-solid-renderer-example' build
      - name: Build Solid 1 host against bundled universal Mesurer Solid
        run: bun run --filter 'mesurer-solid1-example' build
