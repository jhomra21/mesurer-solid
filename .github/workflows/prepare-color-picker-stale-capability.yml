name: prepare-color-picker-stale-capability

on:
  push:
    branches:
      - pr/text-editing-toolbar-parity

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: retry stale Color Picker capability fix' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: pr/text-editing-toolbar-parity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Make unsupported Color Picker removal independent of animation frames
        run: |
          python3 - <<'PY'
          from pathlib import Path

          toolbar = Path('packages/renderer/src/components/Toolbar.tsx')
          text = toolbar.read_text()
          old = '''  const [colorPickerSupported, setColorPickerSupported] = createSignal(false);\n  let colorPickerConfirmFrame = 0;\n  const colorPickerOwnerWindow = () => toolbarElement?.ownerDocument.defaultView ?? props.ownerWindow;\n  const refreshColorPickerCapability = () => {\n    const candidateWindow = colorPickerOwnerWindow();\n    const firstPass = supportsNativeColorPicker(candidateWindow);\n    if (colorPickerConfirmFrame) candidateWindow.cancelAnimationFrame(colorPickerConfirmFrame);\n    colorPickerConfirmFrame = candidateWindow.requestAnimationFrame(() => {\n      colorPickerConfirmFrame = 0;\n      setColorPickerSupported(\n        firstPass && supportsNativeColorPicker(colorPickerOwnerWindow()),\n      );\n      flush();\n    });\n  };'''
          new = '''  const [colorPickerSupported, setColorPickerSupported] = createSignal(false);\n  let colorPickerConfirmTimer = 0;\n  let colorPickerCapabilityRevision = 0;\n  const colorPickerOwnerWindow = () => toolbarElement?.ownerDocument.defaultView ?? props.ownerWindow;\n  const commitColorPickerCapability = (supported: boolean, revision: number) => {\n    colorPickerOwnerWindow().queueMicrotask(() => {\n      if (revision !== colorPickerCapabilityRevision) return;\n      setColorPickerSupported(supported);\n      flush();\n    });\n  };\n  const refreshColorPickerCapability = () => {\n    const candidateWindow = colorPickerOwnerWindow();\n    const revision = ++colorPickerCapabilityRevision;\n    if (colorPickerConfirmTimer) {\n      candidateWindow.clearTimeout(colorPickerConfirmTimer);\n      colorPickerConfirmTimer = 0;\n    }\n    if (!supportsNativeColorPicker(candidateWindow)) {\n      commitColorPickerCapability(false, revision);\n      return;\n    }\n    colorPickerConfirmTimer = candidateWindow.setTimeout(() => {\n      colorPickerConfirmTimer = 0;\n      if (revision !== colorPickerCapabilityRevision) return;\n      commitColorPickerCapability(\n        supportsNativeColorPicker(colorPickerOwnerWindow()),\n        revision,\n      );\n    }, 100);\n  };'''
          if old not in text:
              raise SystemExit('Toolbar capability block anchor not found')
          text = text.replace(old, new, 1)
          old = '''      props.ownerWindow.clearInterval(capabilityInterval);\n      if (colorPickerConfirmFrame) {\n        colorPickerOwnerWindow().cancelAnimationFrame(colorPickerConfirmFrame);\n        colorPickerConfirmFrame = 0;\n      }'''
          new = '''      props.ownerWindow.clearInterval(capabilityInterval);\n      colorPickerCapabilityRevision += 1;\n      if (colorPickerConfirmTimer) {\n        colorPickerOwnerWindow().clearTimeout(colorPickerConfirmTimer);\n        colorPickerConfirmTimer = 0;\n      }'''
          if old not in text:
              raise SystemExit('Toolbar cleanup anchor not found')
          toolbar.write_text(text.replace(old, new, 1))

          interaction = Path('packages/renderer/test/interaction-coordination.test.tsx')
          text = interaction.read_text()
          text = text.replace(
            'it("requires native EyeDropper to remain available through a rendered frame before showing the tool", async () => {',
            'it("requires native EyeDropper to remain available through capability confirmation before showing the tool", async () => {',
            1,
          )
          text = text.replace(
            '    await new Promise((resolve) => window.setTimeout(resolve, 50));',
            '    await new Promise((resolve) => window.setTimeout(resolve, 150));',
            1,
          )
          old = '''    mounted.push(dispose);\n\n    await vi.waitFor(() => expect(document.querySelector('[data-mesurer-tool-id="arrange"] button')).toBeTruthy());\n    expect(pluginHost).toBeTruthy();'''
          new = '''    mounted.push(dispose);\n\n    await vi.waitFor(() => expect(document.querySelector('[data-mesurer-tool-id="arrange"] button')).toBeTruthy());\n    await vi.waitFor(() => expect(document.querySelector('button[aria-label="Color picker (P)"]')).toBeTruthy());\n    expect(pluginHost).toBeTruthy();'''
          if old not in text:
              raise SystemExit('Arrange coordination capability wait anchor not found')
          interaction.write_text(text.replace(old, new, 1))

          contract = Path('visual-parity/color-picker-contract.mjs')
          text = contract.read_text()
          old = '''  await supportedPage.evaluate(() => {\n    Reflect.deleteProperty(window, "EyeDropper");\n    window.dispatchEvent(new Event("focus"));\n  });\n  await supportedPage.waitForFunction(() =>\n    document.querySelector('button[aria-label="Color picker (P)"]') === null,\n  );'''
          new = '''  await supportedPage.evaluate(() => {\n    window.requestAnimationFrame = () => 1;\n    Reflect.deleteProperty(window, "EyeDropper");\n    window.dispatchEvent(new Event("focus"));\n  });\n  await supportedPage.waitForTimeout(200);\n  if (await colorButton.count()) {\n    throw new Error("Color Picker remained visible after native support disappeared while animation frames were unavailable");\n  }'''
          if old not in text:
              raise SystemExit('Browser capability disappearance anchor not found')
          contract.write_text(text.replace(old, new, 1))
          PY
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run --filter 'mesurer-solid-renderer-example' build
      - run: git diff --check
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run focused browser Color Picker contract
        shell: bash
        run: |
          (
            cd examples/basic
            bunx vite --host 127.0.0.1 --port 4174 --strictPort > ../../color-picker-vite.log 2>&1 &
            echo $! > ../../color-picker-vite.pid
          )
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "http://127.0.0.1:4174/" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat color-picker-vite.log || true
            exit 1
          fi
          COLOR_PICKER_URL=http://127.0.0.1:4174/ bun visual-parity/color-picker-contract.mjs
      - name: Commit stale-capability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/renderer/src/components/Toolbar.tsx packages/renderer/test/interaction-coordination.test.tsx visual-parity/color-picker-contract.mjs
          git commit -m "fix: clear stale Color Picker capability"
          git push origin HEAD:pr/text-editing-toolbar-parity
