<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesurer isolated scroll contract</title>
    <style>
      html, body { margin: 0; min-height: 100%; font-family: ui-sans-serif, system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      body { min-height: 4200px; }
      main { padding: 520px 72px 900px; }
      #isolated-scroll-target, #isolated-nested-scroll-target { width: 620px; margin: 0; padding: 12px 16px; border-radius: 8px; font-size: 22px; line-height: 1.35; background: white; }
      #nested-scroll-shell { width: 720px; height: 280px; margin-top: 420px; overflow: auto; overscroll-behavior: contain; border: 1px solid #cbd5e1; border-radius: 12px; background: #e2e8f0; }
      #nested-scroll-content { box-sizing: border-box; height: 1200px; padding: 440px 32px 520px; }
      #shadow-scroll-host { display: block; width: 720px; margin-top: 420px; }
      .after { margin-top: 760px; }
    </style>
  </head>
  <body>
    <main>
      <p id="isolated-scroll-target">Public isolated selection target</p>
      <div id="nested-scroll-shell">
        <div id="nested-scroll-content">
          <p id="isolated-nested-scroll-target">Nested isolated selection target</p>
        </div>
      </div>
      <div id="shadow-scroll-host"></div>
      <p class="after">Scroll runway</p>
    </main>
    <script>
      const host = document.querySelector("#shadow-scroll-host");
      const root = host.attachShadow({ mode: "open" });
      root.innerHTML = `
        <style>
          :host { display: block; }
          #shadow-scroll-shell {
            width: 720px;
            height: 280px;
            overflow: auto;
            overscroll-behavior: contain;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background: #dbeafe;
          }
          #shadow-scroll-content {
            box-sizing: border-box;
            height: 1200px;
            padding: 440px 32px 520px;
          }
          #isolated-shadow-scroll-target {
            width: 620px;
            margin: 0;
            padding: 12px 16px;
            border-radius: 8px;
            font: 22px/1.35 ui-sans-serif, system-ui, sans-serif;
            color: #0f172a;
            background: white;
          }
        </style>
        <div id="shadow-scroll-shell">
          <div id="shadow-scroll-content">
            <p id="isolated-shadow-scroll-target">Cross-shadow isolated selection target</p>
          </div>
        </div>
      `;
    </script>
    <script type="module" src="/src/isolated-scroll.ts"></script>
  </body>
</html>
