<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesurer iframe selection contract</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: system-ui, sans-serif;
      }

      body {
        background: #f5f5f5;
      }

      main {
        padding: 96px;
      }

      iframe {
        display: block;
        width: 480px;
        height: 320px;
        border: 4px solid #111;
        transform: rotate(12deg) scale(0.75);
        transform-origin: top left;
        background: white;
      }
    </style>
  </head>
  <body>
    <main>
      <iframe
        data-testid="same-origin-frame"
        srcdoc='<!doctype html><html><head><style>@keyframes iframe-pulse{from{opacity:.45}to{opacity:1}}</style></head><body style="margin:0;background:white"><button data-testid="frame-target" style="display:block;margin:60px 0 0 80px;width:220px;height:100px;border:0;border-radius:16px;background:#dbeafe;font:600 18px system-ui;animation:iframe-pulse 2s infinite alternate">Frame target</button></body></html>'
      ></iframe>
    </main>
    <script type="module" src="/src/iframe-selection.ts"></script>
  </body>
</html>
