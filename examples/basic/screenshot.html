<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesurer screenshot contract</title>
    <style>
      html, body { margin: 0; min-height: 100%; font-family: ui-sans-serif, system-ui, sans-serif; background: #f5f5f5; }
      main { width: 900px; margin: 120px auto; }
      .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
      .card { min-height: 180px; border-radius: 16px; padding: 24px; background: white; border: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <main>
      <h1>Screenshot contract</h1>
      <div class="cards">
        <article class="card" data-testid="shot-a">Alpha</article>
        <article class="card" data-testid="shot-b">Beta</article>
        <article class="card" data-testid="shot-c">Gamma</article>
      </div>
    </main>
    <script type="module" src="/src/screenshot.ts"></script>
  </body>
</html>
